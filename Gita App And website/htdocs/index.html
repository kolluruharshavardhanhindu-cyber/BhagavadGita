(function(){var d=document.documentElement;d.classList.add('js');var t='light';
try{var s=localStorage.getItem('gitaTheme');if(s==='dark'||s==='light')t=s}catch(e){}
d.setAttribute('data-theme',t);

</script>

        <span id="playAllLabel">Play All</span>
      </button>
      <button id="stopPlayAllBtn" onclick="stopPlayAllMode()" class="play-all-stop-btn hidden" title="Stop Play All">

<!-- RANGE PLAYER MODAL (used by both "Play All" and double-click-a-sloka) -->
<div id="rangeModal" class="hidden" role="dialog" aria-modal="true" aria-labelledby="rangeModalTitle">
  <div class="range-modal-box">
    <div class="modal-head">
      <h3 id="rangeModalTitle">Play Slokas</h3>
      <button type="button" onclick="cancelRangeModal()" class="btn btn-icon btn-ghost btn-sm" aria-label="Close"><span class="material-symbols-outlined" aria-hidden="true">close</span></button>
    </div>

    <div class="range-field-row">
      <div class="range-field">
        <label for="rangeFrom">From</label>
        <input id="rangeFrom" class="input play-all-input" type="number" min="1" value="1" inputmode="numeric" />
      </div>
      <div class="range-field">
        <label for="rangeTo">To</label>
        <input id="rangeTo" class="input play-all-input" type="number" min="1" value="1" inputmode="numeric" />
      </div>
    </div>

    <div class="range-field">
      <label for="rangeIterations">Iterations (1–20)</label>
      <input id="rangeIterations" class="input play-all-input" type="number" min="1" max="20" value="1" inputmode="numeric" />
    </div>

    <div class="range-field">
      <span class="field-label" style="margin:0" id="speedLabel">Speed</span>
      <div class="range-speed-group" role="group" aria-labelledby="speedLabel">
        <button type="button" class="range-speed-btn" data-speed="0.75">0.75x</button>
        <button type="button" class="range-speed-btn active" data-speed="1">1x</button>
        <button type="button" class="range-speed-btn" data-speed="1.25">1.25x</button>
        <button type="button" class="range-speed-btn" data-speed="1.5">1.5x</button>
      </div>
    </div>

    <div class="pattern-actions">
      <button type="button" onclick="startRangePattern('A')" class="btn btn-primary pattern-btn">
        <span>Repeat each sloka</span><small>1,1,2,2,3,3…</small>
      </button>
      <button type="button" onclick="startRangePattern('B')" class="btn pattern-btn">
        <span>Repeat the sequence</span><small>1,2,3,1,2,3…</small>
      </button>
    </div>
  </div>
</div>
