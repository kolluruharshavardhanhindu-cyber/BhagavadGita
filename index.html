<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>శ్రీమద్భగవద్గీత – స్వాగతం</title>

  <!-- Telugu Font -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Noto Sans Telugu', sans-serif;
    }

    html, body{
      width:100%;
      height:100%;
      overflow:hidden; /* 🚫 NO SCROLL */
    }

    body{
      background:
        linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.75)),
        url('backgroundimg.png') center/cover no-repeat fixed;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#fff;
    }

    body::before{
      content:"卐";
      position:fixed;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:22rem;
      opacity:0.05;
      pointer-events:none;
    }

    .container{
      width:92%;
      max-width:560px;
      max-height:90vh;          /* 🔑 fit to screen */
      background:rgba(0,0,0,0.45);
      padding:1.8rem 1.8rem;
      border-radius:22px;
      text-align:center;
      display:flex;
      flex-direction:column;
      justify-content:center;
      gap:0.9rem;
      box-shadow:0 25px 70px rgba(0,0,0,0.65);
      backdrop-filter:blur(6px);
      animation:fadeIn 1.4s ease;
    }

    @keyframes fadeIn{
      from{opacity:0; transform:translateY(20px);}
      to{opacity:1; transform:translateY(0);}
    }

    /* 🔱 MAIN IMAGE AUTO-ADJUST */
    .gita-img{
      max-width:100%;
      max-height:38vh;          /* 🔑 adapts to device height */
      width:auto;
      height:auto;
      object-fit:contain;       /* 🔑 maintain ratio */
      margin:0 auto 0.8rem;
      border-radius:18px;
      box-shadow:0 18px 45px rgba(255,204,102,0.65);
      border:3px solid rgba(255,204,102,0.6);
    }

    h1{
      font-size:clamp(1.8rem, 4vw, 2.4rem);
      color:#ffcc66;
      text-shadow:0 0 25px rgba(255,204,102,0.8);
    }

    h2{
      font-size:clamp(1.1rem, 3vw, 1.35rem);
    }

    p{
      font-size:clamp(0.95rem, 2.7vw, 1.05rem);
      line-height:1.6;
      color:#f3f3f3;
    }

    button{
      margin-top:0.6rem;
      padding:0.85rem 2.4rem;
      font-size:1.1rem;
      font-weight:600;
      border:none;
      border-radius:50px;
      cursor:pointer;
      background:linear-gradient(135deg,#ff9933,#ffcc66);
      color:#3b1f00;
      box-shadow:0 12px 35px rgba(255,153,51,0.55);
      transition:all 0.3s ease;
    }

    button:hover{
      transform:translateY(-2px) scale(1.05);
      box-shadow:0 18px 45px rgba(255,153,51,0.85);
    }

    .mantra{
      font-size:0.95rem;
      color:#ffd699;
      text-shadow:0 0 12px rgba(255,214,153,0.6);
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- CENTER AUTO-RESPONSIVE IMAGE -->
    <img src="mainimg.png" alt="భగవద్గీత విష్వరూపం" class="gita-img">

    <h1>శ్రీమద్భగవద్గీత</h1>
    <h2>ఆధ్యాత్మిక జ్ఞానానికి స్వాగతం</h2>

    <p>
      ధర్మం, కర్మ, భక్తి మరియు మోక్ష మార్గాన్ని
      లోకానికి బోధించిన అమృత గ్రంథం – భగవద్గీత.
    </p>

    <button onclick="navigate('gita.html')">గీతలో ప్రవేశించండి</button>

    <div class="mantra">
      ॥ కృష్ణం వందే జగద్గురుమ్ ॥
    </div>

  </div>

  <script>
    function navigate(page){
    window.location.href = page;
  }
  </script>

</body>
</html>
