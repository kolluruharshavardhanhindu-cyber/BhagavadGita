"తస్మాన్నార్హా వయం హన్తుం ధార్తరాష్ట్రాన్ స్వబాంధవాన్।\nస్వజనం హి కథం హత్వా సుఖిన స్స్యామ మాధవ ॥",
"యద్యప్యేతే న పశ్యంతి లోభోపహత చేతసః |\nకులక్షయకృతం దోషం మిత్రద్రోహే చ పాతకమ్ ॥",
"కథం నజ్ఞేయమస్మాభిః పాపాదస్మాన్నివర్తితుమ్ |\nకులక్షయకృతం దోషం ప్రపశ్యద్భిర్జనార్ధన! ॥",
"కులక్షయే ప్రణశ్యంతి కులధర్మా స్సనాతనః ।\nధర్మే నష్టే కులం కృత్స్నం అధర్మో భిభవత్యుత ॥",
"అధర్మాభిభవాత్ కృష్ణ! ప్రదుష్యంతి కులస్త్రియః |\nస్త్రీషు దుష్టాసు వారేయ! జాయతే వర్ణసంకరః ॥",
"సంకరో నరకాయైవ కులఘ్నానాం కులస్య చ |\nపతన్తి పితరో హ్యేషాం లుప్తపిండోదక క్రియాః ॥",
"దోషై రేతైః కులఘ్నానాం వర్ణసంకర కారకైః |\nఉత్సాద్యంతే జాతిధర్మాః కులధర్మాశ్చ శాశ్వతాః ॥",
"ఉత్సన్న కులధర్మాణాం మనుష్యాణాం జనార్దన! |\nనరకే నియతం వాసః భవతీత్యనుశుశ్రుమ ॥",
"అహో బత మహత్పాపం కర్తుం వ్యవసితా వయమ్ |\nయద్రాజ్య సుఖలోభేన హంతుం స్వజన ముద్యతాః ॥",
"యది మామప్రతీకారం అశస్త్రం శస్త్రపాణయః ।\nధార్తరాష్ట్రా రణే హన్యుః తన్మే క్షేమతరం భవేత్ ॥",
"సంజయ ఉవాచ:\nఏవముక్త్వా ర్జున స్సంఖ్యే రథోపస్థ ఉపావిశత్ |\nవిసృజ్య సశరం చాపం శోకసంవిగ్నమానసః ॥\n\nఓం తత్సదితి, శ్రీమద్భగవద్గీతాసు, ఉపనిషత్సు,\nబ్రహ్మవిద్యాయాం, యోగశాస్త్రే, శ్రీకృష్ణార్జున సంవాదే,\nఅర్జునవిషాదయోగోనామ ప్రథమో ధ్యాయః\n"]},
  2:{name:"సాంఖ్య యోగం",slokas:[
"సంజయ ఉవాచ:\nతం తథా కృపయా విష్టం  అశ్రుపూర్ణా కులేక్షణమ్ |\nవిషీదంతమిదం వాక్యం ఉవాచ మధుసూదనః ॥",
"శ్రీ భగవానువాచ:\nకుతస్త్వా కశ్మల మిదం విషమే సముపస్థితమ్ |\nఅనార్యజుష్టమస్వర్గ్యం అకీర్తికరమర్జున! ॥",
"క్లైబ్యం మా స్మ గమః పార్థ! నైతత్త్వయ్యుపపద్యతే |\nక్షుద్రం హృదయదౌర్బల్యం త్యక్త్వాత్తిష్ఠ పరంతప ॥",
"అర్జున ఉవాచ:\nకథం భీష్మమహం సంఖ్యే ద్రోణం చ మధుసూదన! |\nఇషుభిః ప్రతియోత్స్యామి పూజార్హావరిసూదన! ॥",
"గురునహత్వా హి మహానుభావాన్\nశ్రేయో భోక్తుం భైక్ష్య మపీహ లోకే! |\nహత్వార్థకామాంస్తు గురూనిహైవ\nభుంజీయ భోగాన్ రుధిరప్రదిగ్ధాన్ ॥",
"న చైతద్విద్మః కతరన్నో గరీయః\nయద్వా జయేమ యది వా నో జయేయుః ।\nయానేవ హత్వా న జిజీవిషామః\nతే వస్థితాః ప్రముఖే ధార్తరాష్ట్రాః ॥",
"కార్పణ్యదోషోపహతస్వభావః\nపృచ్ఛామి త్వాం ధర్మసమ్మూఢ చేతాః ।\nయచ్ఛేయ స్స్యాన్నిశ్చితం బ్రూహి తన్మే\nశిష్యస్తే హం శాధి మాం త్వాం ప్రపన్నమ్ ॥",
"న హి ప్రపశ్యామి మమాపనుద్యాత్\nయచ్ఛోక ముచ్ఛోషణ మింద్రియాణామ్ |\nఅవాప్య భూమావసపత్నమృద్ధం\nరాజ్యం సురాణామపి చాధిపత్యమ్ ॥",
"సంజయ ఉవాచ:\nఏవముక్త్వా హృషీకేశం గుడాకేశః పరంతపః |\nన యోత్స్య ఇతి గోవిందం ఉక్త్వా తూస్జీం బభూవ హ ॥",
"తమువాచ హృషీకేశః ప్రహసన్నివ భారత! |\nసేనయోరుభయోర్మధ్యే విషీదంతమిదం వచః ॥",
"శ్రీ భగవానువాచ:\nఅశోచ్యానన్వశోచస్త్వం ప్రజ్ఞావాదాంశ్చ భాషసే |\nగతాసనగతాసూంశ్చ నానుశోచంతి పండితాః ॥",
"న త్వేవాహం జాతు నాసం న త్వం నేమే జనాధిపాః ।\nన చైవ న భవిష్యామః సర్వే వయమతః పరమ్ ॥",
"దేహినో స్మిన్ యథా దేహే కౌమారం యౌవనం జరా |\nతథా దేహాంతర ప్రాప్తిః ధీరస్తత్ర న ముహ్యతి ॥",
"మాత్రాస్పర్శాస్తు కౌంతేయ శీతోష్ణ సుఖదుఃఖదాః |\nఆగమాపాయినో నిత్యాః తాంస్తితిక్షస్వ భారత ॥",
"యం హి న వ్యథయంత్యేతే పురుషం పురుషర్షభ |\nసమదుఃఖసుఖం ధీరం సో మృతత్వాయ కల్పతే ॥",
"నాసతో విద్యతే భావః నాభావో విద్యతే సతః |\nఉభయోరపిదృష్టోమంతః త్వనయోస్తత్త్వదర్శిభిః ॥",
"అవినాశితు తద్విద్ధి యేన సర్వమిదం తతమ్ |\nవినాశ మవ్యయస్యాస్య న కశ్చిత్ కర్తుమర్హతి ॥",
"అంతవంత ఇమే దేహాః నిత్యస్యోక్తా శ్శరీరిణః |\nఅనాశినో ప్రమేయస్య తస్మాద్యుధ్యస్వ భారత ॥",
"య ఏనం వేత్తి హంతారం యశ్చైనం మన్యతే హతమ్ ।\n ఉభౌ తౌ న విజానీతః నాయం హంతి న హన్యతే ॥",
"న జాయతే మ్రియతే వా కదా చిత్\nనాయం భూత్వా భవితా వా న భూయః ।\n అజో నిత్య శ్శాశ్వతో యం పురాణః\nన హన్యతే హన్యమానే శరీరే ॥",
"వేదావినాశినం నిత్యం య ఏనమజ మవ్యయమ్ |\nకథం స పురుషః పార్థ! కం ఘాతయతి హతి కమ్ ॥",
"వాసాంసి జీర్ణాని యథా విహాయ\n నవాని గృహ్లాతి నరో పరాణి ।\n తథా శరీరాణి విహాయ జీర్ణాని\n అన్యాని సంయాతి నవాని దేహీ ॥",
"నైనం ఛిందంతి శస్త్రాణి నైనం దహతి పావకః ।\n న చైనం క్లేదయంత్యాపః న శోషయతి మారుతః ॥",
"అచ్ఛేద్యో యమదాహ్యో యం అక్లేద్యో శోష్య ఏవ చ|\n నిత్య స్సర్వగత స్థాణుః అచలో యం సనాతనః ॥",
"అవ్యక్తో యమచింత్యో యం అవికార్యో యముచ్యతే।\n తస్మాదేవం విదిత్వైనం నానుశోచితుమర్హసి ॥",
"అథ చైనం నిత్యజాతం నిత్యం వా మన్యసే మృతమ్ |\n తథా పి త్వం మహాబాహో! నైవం శోచితుమర్హసి ॥",
"జాతస్య హి ధ్రువో మృత్యుః ధ్రువం జన్మ మృతస్య చ |\n తస్మాదపరిహార్యే ర్థేన త్వం శోచితుమర్హసి ॥",
"అవ్యక్తాదీని భూతాని వ్యక్తమధ్యాని భారత! |\n అవ్యక్తనిధనాన్యేవ తత్ర కా పరిదేవనా ॥",
"ఆశ్చర్యవత్పశ్యతి కశ్చిదేనం\n ఆశ్చర్యవద్వదతి తథైవ చాన్యః |\n ఆశ్చర్య వచ్చెన మన్యశ్శృణోతి\n శ్రుత్వా౨ ప్యేనం వేద న చైవ కశ్చిత్ ॥",
"దేహీ నిత్యమవధ్యో యం దేహే సర్వస్య భారత! |\n తస్మాత్ సర్వాణి భూతాని న త్వం శోచితుమర్హసి ॥",
"స్వధర్మమపి చావేక్ష్య న వికంపితు మర్హసి |\n ధర్మ్యాద్ధి యుద్ధాచ్ఛేయో న్యత్ క్షత్రియస్య న విద్యతే ॥",
"యదృచ్ఛయా చోపపన్నం స్వర్గద్వార మపావృతమ్ |\n సుఖినః క్షత్రియాః పార్థ! లభంతే యుద్ధమీదృశమ్ ॥",
"అథ చేత్త్వమిమం ధర్మ్యం సంగ్రామం న కరిష్యసి |\n తతస్స్వధర్మం కీర్తిం చ హిత్వా పాప మవాప్స్యసి ॥",
"అకీర్తిం చాపి భూతాని కథయిష్యంతి తే వ్యయామ్ |\nసంభావితస్య చాకీర్తిః మరణాదతిరిచ్యతే ॥",
"భయాద్రణాదుపరతం మంస్యంతే త్వాం మహారథాః ।\nయేషాం చ త్వం బహుమతః భూత్వా యాస్యసి లాఘవమ్॥",
"అవాచ్యవాదాంశ్చ బహూన్ వదిష్యంతి తవాహితాః |\nనిందంతస్తవ సామర్థ్యం తతో దుఃఖతరం ను కిమ్ ॥",
"హతో వా ప్రాప్స్యసి స్వర్గం జిత్వా వా భోక్ష్యసే మహీమ్ |\nతస్మాదుత్తిష్ఠ కౌంతేయ! యుద్ధాయ కృతనిశ్చయః ॥",
"సుఖదుఃఖే సమే కృత్వా లాభాలాభౌ జయాజయౌ |\nతతో యుద్ధాయ యుజ్యస్వ నైవం పాపమవాప్స్యసి ॥",
"ఏషా తే భిహితా సాంఖ్యే బుద్ధిర్యోగే త్విమాం శృణు |\nబుద్ధ్యా యుక్తో యయా పార్థ! కర్మబంధం ప్రహాస్యసి ॥",
"నేహాభిక్రమనాశోస్తి ప్రత్యవాయో న విద్యతే |\nస్వల్పమప్యస్య ధర్మస్య త్రాయతే మహతో భయాత్ ॥",
"వ్యవసాయాత్మికా బుద్ధిః ఏకేహ కురునందన! |\nబహుశాఖా హ్యనంతాశ్చ బుద్ధయో వ్యవసాయినామ్ ॥",
"యామిమాం పుష్పితాం వాచం ప్రవదంత్యవిపశ్చితః |\nవేదవాదరతాః పార్థ! నాన్యదస్తీతి వాదినః ॥",
"కామాత్మాన స్స్వర్గపరాః జన్మకర్మఫలప్రదామ్ |\nక్రియావిశేషబహులాం భోగైశ్వర్యగతిం ప్రతి ॥",
"భోగైశ్వర్యప్రసక్తానాం తయాపహృత చేతసామ్ |\nవ్యవసాయాత్మికా బుద్ధిః సమాధౌ న విధీయతే ॥",               
"త్రైగుణ్యవిషయా వేదాః నిస్త్రైగుణ్యో భవార్జున! ।\nనిర్ద్వంద్వో నిత్యసత్త్వస్థః నిర్యోగక్షేమ ఆత్మవాన్ ॥",
"యావానర్థ ఉదపానే సర్వత స్సంప్లుతోదకే ।\nతావాన్ సర్వేషు వేదేషు బ్రాహ్మణస్య విజానతః ॥",
"కర్మణ్యేవాధికారస్తే మా ఫలేషు కదాచన ।\nమా కర్మఫలహేతుర్భూః మాతే సంగోస్త్వకర్మణి ॥",
"యోగస్థః కురు కర్మాణి సంగం త్యక్త్వా ధనంజయ! |\nసిద్ధ్యసిద్ధ్యి స్సమో భూత్వా సమత్వం యోగ ఉచ్యతే ॥",
"దూరేణ హ్యవరం కర్మ బుద్ధియోగాద్ధనంజయ |\nబుద్ధా శరణమన్విచ్ఛ కృపణాః ఫల హేతవః ॥",
"బుద్ధియుక్తో జహాతీహ ఉభే సుకృత దుష్కృతే ।\nతస్మాద్యోగాయ యుజ్యస్వ యోగః కర్మసు కౌశలమ్ ॥",
"కర్మజం బుద్ధి యుక్తా హి ఫలం త్యక్త్వా మనీషిణః |జన్మబంధ వినిర్ముక్తాః పదం గచ్ఛంత్యనామయమ్ ॥",
"యదా తే మోహకలిలం బుద్ధిర్వ్యతితరిష్యతి |\nతదా గంతాసి నిర్వేదం శ్రోతవ్యస్య శ్రుతస్య చ ॥",
"శ్రుతివిప్రతిపన్నా తే యదా స్థాస్యతి నిశ్చలా |\nసమాధావచలా బుద్ధిః తదా యోగమవాప్స్యసి ॥",
"అర్జున ఉవాచ:\nస్థితప్రజ్ఞస్య కా భాషా సమాధిస్థస్య కేశవ! ।\nస్థితధీః కిం ప్రభాషేత కిమాసీత వ్రజేత కిమ్ ॥",
"శ్రీ భగవానువాచ:\nప్రజహాతి యదా కామాన్ సర్వాన్ పార్థ! మనోగతాన్ |\nఆత్మన్యేవాత్మనా తుష్టః స్థితప్రజ్ఞస్తదోచ్యతే ॥",
"దుఃఖేష్వనుద్విగ్న మనాః సుఖేషు విగతస్పృహః ।\nవీతరాగభయక్రోధః స్థితధీర్మునిరుచ్యతే ॥",
"యస్సర్వత్రానభిస్నేహః తత్తత్ ప్రాప్య శుభాశుభమ్ ।\nనాభినందతి న ద్వేష్టి తస్య ప్రజ్ఞా ప్రతిష్ఠితా ॥",
"యదా సంహరతే చాయం కూర్మోంగానీవ సర్వశః ।\nఇంద్రియాణీంద్రియార్థేభ్యః తస్య ప్రజ్ఞా ప్రతిష్ఠితా ॥",
"విషయా వినివర్తంతే నిరాహారస్య దేహినః ।\nరసవర్ణం రసో ప్యస్య పరం దృష్ట్వా నివర్తతే ॥",
"యతతో హ్యపి కౌంతేయ! పురుషస్య విపశ్చితః |\nఇంద్రియాణి ప్రమాథీని హరంతి ప్రసభం మనః ॥",
"తాని సర్వాణి సంయమ్య యుక్త ఆసీత మత్పరః |\nవశే హి యస్యేంద్రియాణి తస్య ప్రజ్ఞా ప్రతిష్ఠితా ॥",
"ధ్యాయతో విషయాన్ పుంసః సంగస్తేషూపజాయతే |\nసంగాత్ సంజాయతే కామః కామాత్ క్రోధో భిజాయతే॥",
"క్రోధాద్భవతి సమ్మోహః సమ్మోహాత్ స్మృతివిభ్రమః |\nస్మృతిభ్రంశాద్బుద్ధినాశః బుద్ధినాశాత్ ప్రణశ్యతి ॥",
"రాగద్వేష వియుక్తాస్తు విషయానింద్రియైశ్చరన్ |\nఆత్మవశ్యైర్విధేయాత్మా ప్రసాద మధిగచ్ఛతి ॥",
"ప్రసాదే సర్వదుఃఖానాం హానిరస్యోపజాయతే |\nప్రసన్న చేతసో హ్యాశు బుద్ధిః పర్యవతిష్ఠతే ॥",
"నాస్తి బుద్ధిరయుక్తస్య న చాయుక్తస్య భావనా |\nన చాభావయత శ్శాంతిః అశాంతస్య కుత స్సుఖమ్ ॥",
"ఇంద్రియాణాం హి చరతాం యన్మనోనువిధీయతే |\nతదస్య హరతి ప్రజ్ఞాం వాయుర్నావ మివాంభసి ॥",
"తస్మాద్యస్య మహాబాహో! నిగృహీతాని సర్వశః |\nఇంద్రియాణీంద్రియార్థేభ్యః తస్య ప్రజ్ఞా ప్రతిష్ఠితా ॥",
"యా నిశా సర్వభూతానాం తస్యాం జాగర్తి సంయమీ ।\nయస్యాం జాగ్రతి భూతాని సా నిశా పశ్యతో మునేః ॥",
"ఆపూర్యమాణ మచల ప్రతిష్ఠం\nసముద్రమాపః ప్రవిశంతి యద్వత్ |\nతద్వత్ కామా యం ప్రవిశంతి సర్వే\nస శాంతిమాప్నోతి న కామకామీ ॥",
"విహాయ కామాన్ యస్సర్వాన్ పుమాంశ్చరతి నిస్స్పృహః ।\nనిర్మమో నిరహంకారః స శాంతి మధిగచ్ఛతి ॥",
"ఏషా బ్రాహ్మీస్థితిః పార్థ! నైనాం ప్రాప్య విముహ్యతి ।\nస్థిత్వా స్యామంతకాలే.పి బ్రహ్మనిర్వాణ మృచ్ఛతి ॥\n\nఓం తత్సదితి, శ్రీమద్భగవద్గీతాసు, ఉపనిషత్సు,\nబ్రహ్మవిద్యాయాం యోగశాస్త్రే శ్రీకృష్ణార్జున సంవాదే\nసాంఖ్యయోగోనామ ద్వితీయోధ్యాయః"]},
3:{name:"కర్మ యోగం",slokas:[
"అర్జున ఉవాచ:\nజ్యాయసీ చేత్ కర్మణస్తే మతా బుద్ధిర్జనార్దన! ।\nతత్కిం కర్మణి ఘోరే మాం నియోజయసి కేశవ! ॥",
"వ్యామిశ్రేణేవ వాక్యేన బుద్ధిం మోహయసీవ మే ।\nతదేకం వద నిశ్చిత్య యేన శ్రేయో హమాప్నుయామ్ ॥",
"శ్రీభగవానువాచ:\nలోకే స్మిన్ ద్వివిధా నిష్ఠా పురా ప్రోక్తా మయా నఘ! |\nజ్ఞానయోగేన సాంఖ్యానాం కర్మయోగేన యోగినామ్ ॥",
"న కర్మణామనారంభాత్ నైష్కర్మ్యం పురుషో శ్నుతే ।\nన చ సన్న్యసనాదేవ సిద్ధిం సమధిగచ్ఛతి ॥",
"న హి కశ్చిత్ క్షణమపి జాతు తిష్ఠత్యకర్మకృత్ |\nకార్యతే హ్యవశః కర్మ సర్వః ప్రకృతిజైర్గుణైః ॥",
"కర్మేంద్రియాణి సంయమ్య య ఆస్తే మనసా స్మరన్ |\nఇంద్రియార్థాన్ విమూఢాత్మా మిథ్యాచార స్స ఉచ్యతే ॥",
"యస్త్వింద్రియాణి మనసా నియమ్యారభతేర్జున! |\nకర్మేంద్రియైః కర్మయోగం అసక్త స్స విశిష్యతే ॥",
"నియతం కురు కర్మ త్వం కర్మ జ్యాయో హ్యకర్మణః ।\nశరీరయాత్రా పి చ తే న ప్రసిద్ధ్యేదకర్మణః ॥",
"యజ్ఞార్థాత్ కర్మణో2 న్యత్ర లోకోయం కర్మబంధనః |\nతదర్థం కర్మ కౌంతేయ! ముక్తసంగ స్సమాచర ॥",
"సహయజ్ఞాః ప్రజా స్పృష్ట్వా పురోవాచ ప్రజాపతిః |\nఅనేన ప్రసవిష్యధ్వం ఏష వో స్త్విష్టకామధుక్ ॥",
"దేవాన్ భావయతానేన తే దేవా భావయంతు వః ।\nపరస్పరం భావయంతః శ్రేయః పరమవాప్స్యథ ॥",
"ఇష్టాన్ భోగాన్ హి వో దేవాః దాస్యంతే యజ్ఞభావితాః |\nతైర్దత్తానప్రదాయైభ్యః యో భుంక్తే స్తేన ఏవ సః ॥",
"యజ్ఞశిష్టాశిన స్సంతః ముచ్యంతే సర్వకిల్బిషైః |\nభుంజతే తే త్వఘం పాపాః యే పచంత్యాత్మకారణాత్ ॥",
"అన్నా ద్భవంతి భూతాని పర్జన్యాదన్నసంభవః |\nయజ్ఞాద్భవతి పర్జన్యః యజ్ఞః కర్మసముద్భవః ॥",
"కర్మ బ్రహ్మోద్భవం విద్ధి బ్రహ్మాక్షరసముద్భవమ్ |\nతస్మాత్ సర్వగతం బ్రహ్మ నిత్యం యజ్ఞే ప్రతిష్ఠితమ్ ॥",
"ఏవం ప్రవర్తితం చక్రం నానువర్తయతీహ యః |\nఅఘాయురింద్రియారామః మోఘం పార్థ! స జీవతి ॥",
"యస్త్వాత్మరతిరేవ స్యాత్ ఆత్మతృప్తశ్చ మానవః ।\nఆత్మన్యేవ చ సంతుష్టః తస్య కార్యం న విద్యతే ॥",
"నైవ తస్య కృతేనార్థః నాకృతేనేహ కశ్చన ।\nన చాస్య సర్వభూతేషు కశ్చిదరవ్యపాశ్రయః ॥",
"తస్మాదసక్త స్సతతం కార్యం కర్మ సమాచర |\nఅసక్తో హ్యాచరన్ కర్మ పరమాప్నోతి పూరుషః ॥",
"కర్మణైవ హి సంసిద్ధిం ఆస్థితా జనకాదయః |\nలోకసంగ్రహమేవాపి సంపశ్యన్ కర్తుమర్హసి ॥",
"యద్యదాచరతి శ్రేష్ఠః తత్తదేవేతరో జనః |\nస యత్ప్రమాణం కురుతే లోకస్తదనువర్తతే ॥",
"న మే పార్థాస్తి కర్తవ్యం త్రిషు లోకేషు కించన ।\nనానవాప్తమవాప్తవ్యం వర్త ఏవ చ కర్మణి ॥",
"యది హ్యహం న వర్తేయ జాతు కర్మణ్యతంద్రితః |\nమమ వర్మానువర్తంతే మనుష్యాః పార్థ! సర్వశః ॥",
"ఉత్సీదేయురిమే లోకాః న కుర్యాం కర్మ చేదహమ్ |\nసంకరస్య చ కర్తా స్యాం ఉపహన్యా మిమాః ప్రజాః ॥",
"సక్తాః కర్మణ్య విద్వాంసః యథా కుర్వంతి భారత! |\nకుర్యాద్విద్వాంస్తథా సక్తః చికీర్షుర్లోక సంగ్రహమ్ ॥",
"న బుద్ధిభేదం జనయేత్ అజ్ఞానాం కర్మసంగినామ్ |\nజోషయేత్ సర్వకర్మాణి విద్వాన్ యుక్త స్సమాచరన్ ॥",
"ప్రకృతేః క్రియమాణాని గుణైః కర్మాణి సర్వశః |\nఅహంకారవిమూఢాత్మా కర్తా హమితి మన్యతే ॥",
"తత్త్వవిత్తు మహాబాహో! గుణకర్మవిభాగయోః |\nగుణా గుణేషు వర్తంతే ఇతి మత్వా న సజ్జతే ॥",
"ప్రకృతేర్గుణసమ్మూఢాః సజ్జంతే గుణకర్మసు ।\nతానకృత్స్నవిదో మందాన్ కృత్స్నవిన్న విచాలయేత్ ॥",
"మయి సర్వాణి కర్మాణి సన్న్యస్యాధ్యాత్మచేతసా ।\nనిరాశీర్నిర్మమో భూత్వా యుధ్యస్వ విగతజ్వరః ॥",
"యే మే మతమిదం నిత్యం అనుతిష్ఠంతి మానవాః |\nశ్రద్ధావంతో నసూయంతః ముచ్యంతే తే పి కర్మభిః ॥",
"యే త్వేతదభ్యసూయంతః నానుతిష్ఠంతి మే మతమ్ |\nసర్వజ్ఞానవిమూఢాంస్తాన్ విద్ధి నష్టానచేతసః ॥",
"సదృశం చేష్టతే స్వస్యాః ప్రకృతేర్ జ్ఞానవానపి |\nప్రకృతిం యాంతి భూతాని నిగ్రహః కిం కరిష్యతి ॥",
"ఇంద్రియసేంద్రియస్యార్థే రాగద్వేషౌ వ్యవస్థితౌ |\nతయోర్న్ వశమాగచ్ఛేత్ తౌ హ్యస్య పరిపన్ధినౌ ॥",
"శ్రేయాన్ స్వధర్మో విగుణః పరధర్మాత్ స్వనుష్ఠితాత్ |\nస్వధర్మే నిధనం శ్రేయః పరధర్మో భయావహః ॥",
"అర్జున ఉవాచ:\nఅథ కేన ప్రయుక్తో యం పాపం చరతి పూరుషః ।\nఅనిచ్ఛన్నపి వార్జేయ! బలాదివ నియోజితః ॥",
"శ్రీ భగవానువాచ:\nకామ ఏష క్రోధ ఏషః రజోగుణ సముద్భవః |\nమహాశనో మహాపాప్మా విధ్యేనమిహ వైరిణమ్ ॥",
"ధూమేనావ్రియతే వహ్నిః యథా దర్శో మలేన చ |\nయథోల్బేనావృతో గర్భః తథా తేనేదమావృతమ్ ॥",
"ఆవృతం జ్ఞానమేతేన జ్ఞానినో నిత్యవైరిణా |\nకామరూపేణ కౌంతేయ! దుష్పూరేణానలేన చ ॥",
"ఇంద్రియాణి మనో బుద్ధిః అస్యాధిష్ఠాన ముచ్యతే |\nఏతైర్విమోహయత్యేషః జ్ఞానమావృత్య దేహినమ్ ॥",
"తస్మాత్త్వమింద్రియాణ్యాదౌ నియమ్య భరతర్షభ! |\nపాప్మానం ప్రజహి హ్యేనం జ్ఞాన విజ్ఞాన నాశనమ్ ॥",
"ఇంద్రియాణి పరాణ్యాహుః ఇంద్రియేభ్యః పరం మనః |\nమనసస్తు పరా బుద్ధిః యో బుద్ధేః పరతస్తు సః ॥",
"ఏవం బుద్ధేః పరం బుద్ధ్వా సంస్తభ్యాత్మానమాత్మనా|\nజహి శత్రుం మహాబాహో! కామరూపం దురాసదమ్ ॥\n\nఓం తత్సదితి, శ్రీమద్భగవద్గీతాసు, ఉపనిషత్సు,\nబ్రహ్మవిద్యాయాం యోగశాస్త్రే శ్రీకృష్ణార్జున సంవాదే\nకర్మయోగోనామ తృతీయోధ్యాయః"]},
4:{name:"జ్ఞాన కర్మ సన్యాస యోగం",slokas:[
"శ్రీ భగవానువాచ:\nఇమం వివస్వతే యోగం ప్రోక్తవానహ మవ్యయమ్ ।\nవివస్వాన్ మనవే ప్రాహ మను రిక్ష్వాకవే బ్రవీత్ ॥",
"ఏవం పరంపరా ప్రాప్తం ఇమం రాజర్షయో విదుః ।\nస కాలేనేహ మహతా యోగోనష్టః పరంతప! ॥",
"స ఏవాయం మయా తేద్య యోగః ప్రోక్తః పురాతనః |\nభక్తిసి మే సఖా చేతి రహస్యం హ్యేతదుత్తమమ్ ॥",
"అర్జున ఉవాచ:\nఅపరం భవతో జన్మ పరం జన్మ వివస్వతః |\nకథమేతద్విజానీయాం త్వమాదౌ ప్రోక్తవానితి ॥",
"శ్రీ భగవానువాచ:\nబహూని మే వ్యతీతాని జన్మాని తవ చార్జున! |\nతాన్యహం వేద సర్వాణి న త్వం వేత్థ పరంతప! ॥",
"అజో పి సన్నవ్యయాత్మా భూతానామీశ్వరో పి సన్ |\nప్రకృతిం స్వామధిష్ఠాయ సంభవామ్యాత్మమాయయా ॥",
"యదా యదా హి ధర్మస్య గ్లానిర్భవతి భారత! |\nఅభ్యుత్థానమధర్మస్య తదా 2 త్మానం సృజామ్యహమ్ ॥",
"పరిత్రాణాయ సాధూనాం వినాశాయ చ దుష్కృతామ్ |\nధర్మసంస్థాపనార్థాయ సంభవామి యుగే యుగే ॥",
"జన్మకర్మ చ మే దివ్యం ఏవం యో వేత్తి తత్త్వతః ।\nత్యక్త్వా దేహం పునర్జన్మ నైతి మామేతి సోర్జున! ॥",
"వీతరాగభయక్రోధాః మన్మయా మాముపాశ్రితాః ।\nబహవో జ్ఞానతపసా పూతా మద్భావమాగతాః ॥",
"యే యథా మాం ప్రపద్యంతే తాం స్తథైవ భజామ్యహమ్।\nమమ వర్మానువర్తంతే మనుష్యాః పార్థ! సర్వశః ॥", 
"కాంక్షంతః కర్మణాం సిద్ధిం యజంత ఇహ దేవతాః ।\nక్షిప్రం హి మానుషే లోకే సిద్ధిర్భవతి కర్మజా ॥",
"చాతుర్వర్ణ్యం మయా సృష్టం గుణకర్మవిభాగశః |\nతస్య కర్తారమపి మాం విద్యకర్తారమవ్యయమ్ ॥",
"న మాం కర్మాణి లింపంతి న మే కర్మఫలే స్పృహా ।\nఇతి మాం యో భిజానాతి కర్మభిర్న స బధ్యతే ॥",
"ఏవం జ్ఞాత్వా కృతం కర్మ పూర్వైరపి ముముక్షుభిః |\nకురు కర్మైవ తస్మాత్ త్వం పూర్వైః పూర్వతరం కృతమ్ ॥",
"కింకర్మ కిమకర్మేతి కవయోప్యత్ర మోహితాః ।\nతత్తే కర్మ ప్రవక్ష్యామి యజ్ జ్ఞాత్వా మోక్ష్యసే శుభాత్ ॥",
"కర్మణో హ్యపి బోద్ధవ్యం బోధ్ధవ్యం చ వికర్మణః |\nఅకర్మణశ్చ బోద్ధవ్యం గహనా కర్మణో గతిః ॥",
"కర్మణ్యకర్మ యః పశ్యేత్ అకర్మణి చ కర్మ యః |\nస బుద్ధిమాన్ మనుష్యేషు స యుక్తః కృత్స్నకర్మకృత్ ॥",
"యస్య సర్వే సమారంభాః కామసంకల్ప వర్జితాః |\nజ్ఞానాగ్ని దగ్ధకర్మాణం తమాహుః పండితం బుధాః ॥",
"త్యక్త్వా కర్మఫలాసంగం నిత్యతృప్తో నిరాశ్రయః |\nకర్మణ్యభిప్రవృత్తో పి నైవ కించిత్ కరోతి సః ॥",
"నిరాశీర్యతచిత్తాత్మా త్యక్త సర్వపరిగ్రహః |\nశారీరం కేవలం కర్మ కుర్వన్నాప్నోతి కిల్బిషమ్ ॥",
"యదృచ్ఛా లాభసంతుష్టః ద్వంద్వాతీతో విమత్సరః |\nసమస్సిద్ధావసిద్ధా చ కృత్వా పి న నిబధ్యతే ॥",
"గత సంగస్య ముక్తస్య జ్ఞానావస్థిత చేతసః |\nయజ్ఞాయాచరతః కర్మ సమగ్రం ప్రవిలీయతే ॥",
"బ్రహ్మార్పణం బ్రహ్మహవిః బ్రహ్మాగ్నౌ బ్రహ్మణా హుతమ్ |\nబ్రహ్మైవ తేన గంతవ్యం బ్రహ్మకర్మసమాధినా ॥",
"దైవమేవాపరే యజ్ఞం యోగినః పర్యుపాసతే |\nబ్రహ్మాగ్నావపరే యజ్ఞం యజ్ఞేనైవోపజుహ్వతి ॥",
"శ్రోత్రాదీనీంద్రియాణ్యన్యే సంయమాగ్నిషు జుహ్వతి |\nశబ్దాదీన్ విషయానన్యే ఇంద్రియాగ్నిషు జుహ్వతి ॥",
"సర్వాణీంద్రియకర్మాణి ప్రాణకర్మాణి చాపరే |\nఆత్మసంయమయోగాగ్నౌ జుహ్వతి జ్ఞానదీపితే ॥",
"ద్రవ్యయజ్ఞాస్తపోయజ్ఞాః యోగయజ్ఞా స్తథా పరే |\nస్వాధ్యాయజ్ఞానయజ్ఞాశ్చ యతయ స్సంశితవ్రతాః ॥",
"అపానే జుహ్వతి ప్రాణం ప్రాణే పానం తథా పరే |\nప్రాణాపానగతీ రుధ్వా ప్రాణాయామ పరాయణాః ॥",
"అపరే నియతాహారాః ప్రాణాన్ ప్రాణేషు జుహ్వతి ।\nసర్వే ప్యేతే యజ్ఞవిదః యజ్ఞక్షపితకల్మషాః ॥",
"యజ్ఞశిష్టామృతభుజః యాంతి బ్రహ్మ సనాతనమ్ |\nనాయం లోకో స్త్యయజ్ఞస్య కుతో న్యః కురుసత్తమ! ॥",
"ఏవం బహువిధా యజ్ఞాః వితతా బ్రహ్మణో ముఖే |\nకర్మజాన్ విద్ధి తాన్ సర్వాన్ ఏవం జ్ఞాత్వా విమోక్ష్యసే ॥",
"శ్రేయాన్ ద్రవ్యమయాద్యజ్ఞాత్ జ్ఞానయజ్ఞః పరంతప! |\nసర్వం కర్మాఖిలం పార్థ! జ్ఞానే పరిసమాప్యతే ॥",
"తద్విద్ధి ప్రణిపాతేన పరిప్రశ్నే న సేవయా ।\nఉపదేక్ష్యంతి తే జ్ఞానం జ్ఞానినస్తత్త్వదర్శినః ॥",
"యజ్ జ్ఞాత్వా న పునర్మోహం ఏవం యాస్యసి పాండవ! |\nయేన భూతాన్యశేషేణ ద్రక్ష్యస్యాత్మన్యథో మయి ॥",
"అపి చేదసి పాపేభ్యః సర్వేభ్యః పాపకృత్తమః ।\nసర్వం జ్ఞానప్లవేనైవ వృజినం సంతరిష్యసి ॥",
"యథైంసి సమిద్ధోగ్నిః భస్మసాత్కురుతే ర్జున |\nజ్ఞానాగ్ని స్సర్వకర్మాణి భస్మసాత్కురుతే తథా ॥",
"న హి జ్ఞానేన సదృశం పవిత్రమిహ విద్యతే |\nతత్స్వయం యోగసంసిద్ధః కాలేనాత్మని విందతి ॥",
"శ్రద్ధావాన్ లభతే జ్ఞానం తత్పరః సంయతేంద్రియః |\nజ్ఞానం లబ్ధ్వా పరాం శాంతిం అచిరేణాధిగచ్ఛతి ॥",
"అజ్ఞశ్చాశ్రద్దధానశ్చ సంశయాత్మా వినశ్యతి ।\nనాయం లోకోస్తి న పరః న సుఖం సంశయాత్మనః ॥",
"యోగసన్న్యస్త కర్మాణం జ్ఞానసంఛిన్నసంశయమ్ |\nఆత్మవంతం న కర్మాణి నిబధ్నంతి ధనంజయ! ॥",
"తస్మాదజ్ఞానసంభూతం హృత్స్థం జ్ఞానాసినా త్మనః |\nఛిత్వైనం సంశయం యోగం ఆతిష్టోత్తిష్ఠ భారత! ॥\n\nఓం తత్సదితి, శ్రీమద్భగవద్గీతాసు, ఉపనిషత్సు,\nబ్రహ్మవిద్యాయాం యోగశాస్త్రే శ్రీకృష్ణార్జున సంవాదే\nజ్ఞానయోగోనామ చతుర్థో ధ్యాయః"]},
5:{name:"కర్మ సన్యాస యోగం",slokas:[
"అర్జున ఉవాచ:\nసన్న్యాసం కర్మణాం కృష్ణ! పునర్యోగం చ శంససి |\nయచ్ఛేయ ఏతయోరేకం తన్మే బ్రూహి సునిశ్చితమ్ ॥",
"శ్రీ భగవానువాచ:\nసన్న్యాసః కర్మయోగశ్చ నిశ్రేయసకరావుభౌ |\nతయోస్తు కర్మసన్న్యాసాత్ కర్మయోగో విశిష్యతే ॥",
"జ్ఞేయ స్స నిత్యసన్న్యాసీ యో న ద్వేష్టి న కాంక్షతి |\nనిర్ద్వంద్వో హి మహాబాహో! సుఖం బంధాత్ప్రముచ్యతే ॥",
"సాంఖ్యయోగౌ పృథగ్బాలాః ప్రవదంతి న పండితాః |\nఏకమప్యాస్థిత స్సమ్యక్ ఉభయోర్విందతే ఫలమ్ ॥",
"యత్సాంఖ్యైః ప్రాప్యతే స్థానం తద్యోగైరపి గమ్యతే |\nఏకం సాంఖ్యం చ యోగం చ యః పశ్యతి స పశ్యతి ॥",
"సన్న్యాసస్తు మహాబాహో! దుఃఖమాప్తుమయోగతః |\nయోగయుక్తో మునిర్ర్బహ్మ నచిరేణాధిగచ్ఛతి ॥",
"యోగయుక్తో విశుద్ధాత్మా విజితాత్మాజితేంద్రియః |\nసర్వభూతాత్మభూతాత్మా కుర్వన్నపి న లిప్యతే ॥",
"నైవ కించిత్ కరోమీతి యుక్తో మన్యేత తత్త్వవిత్ |\nపశ్యన్ శృణ్వన్ స్పృశన్ జిఘ్రన్ అశ్నన్ గచ్ఛన్ స్వపన్ శ్వసన్॥",
"ప్రలపన్ విసృజన్ గృహన్ ఉన్మిషన్ నిమిషన్నపి ।\nఇంద్రియాణీంద్రియార్థేషు వర్తంత ఇతి ధారయన్ ॥",
"బ్రహ్మణ్యాధాయ కర్మాణి సంగం త్యక్త్వా కరోతి యః |\nలిప్యతే న స పాపేన పద్మపత్రమివాంభసా ॥",
"కాయేన మనసా బుద్ధ్యా కేవలైరింద్రియైరపి ।\nయోగినః కర్మ కుర్వంతి సంగం త్యక్త్వాత్మశుద్ధయే ॥",
"యుక్తః కర్మఫలం త్యక్త్వా శాంతి మాప్నోతి నైష్ఠికీమ్ |\nఅయుక్తః కామకారేణ ఫలే సక్తో నిబధ్యతే ॥",
"సర్వకర్మాణి మనసా సన్న్యస్యాస్తే సుఖం వశీ |\nనవద్వారే పురే దేహీ నైవ కుర్వన్న కారయన్ ॥",
"న కర్తృత్వం న కర్మాణి లోకస్య సృజతి ప్రభుః |\nన కర్మఫలసంయోగం స్వభావస్తు ప్రవర్తతే ॥",
"నాదత్తే కస్యచిత్ పాపం న చైవ సుకృతం విభుః |\nఅజ్ఞానేనావృతం జ్ఞానం తేన ముహ్యంతి జంతవః ॥",
"జ్ఞానేన తు తదజ్ఞానం యేషాం నాశితమాత్మనః |\nతేషామాదిత్యవజ్ జ్ఞానం ప్రకాశయతి తత్పరమ్ ॥",
"తద్బుద్ధయస్తదాత్మానః తన్నిష్ఠాస్తత్పరాయణాః |\nగచ్ఛంత్యపునరావృత్తిం జ్ఞాననిర్ధూతకల్మషాః ॥",
"విద్యావినయసంపన్నే బ్రాహ్మణే గవి హస్తిని|\nశుని చైవ శ్వపాకే చ పండితా స్సమదర్శినః ॥",
"ఇహైవ తైర్జిత స్సర్గః యేషాం సామ్యే స్థితం మనః |\nనిర్దోషం హి సమం బ్రహ్మ తస్మాద్భహ్మణి తే స్థితాః ॥",
"న ప్రహృష్యేత్రియం ప్రాప్య నోద్విజేత్రాప్య చాప్రియమ్ |\nస్థిరబుద్ధిరసమ్మూఢః బ్రహ్మవిద్ర్బహ్మణి స్థితః ॥",
"బాహ్యస్పర్శేష్వసక్తాత్మా విందత్యాత్మని యత్సుఖమ్ |\nస బ్రహ్మయోగయుక్తాత్మా సుఖమక్షయమశ్నుతే ॥",
"యే హి సంస్పర్శజా భోగాః దుఃఖయోనయ ఏవ తే |\nఆద్యంతవంతః కౌంతేయ! న తేషు రమతే బుధః ॥",
"శక్నోతీహైవ యస్సోఢుం ప్రాక్శరీర విమోక్షణాత్ |\nకామక్రోధోద్భవం వేగం స యుక్త స్స సుఖీ నరః ॥",
"యోంత స్సుఖోంతరారామః తథాంతర్జ్యోతిరేవ యః|\nస యోగీ బ్రహ్మనిర్వాణం బ్రహ్మభూతో ధిగచ్ఛతి ॥",
"లభంతే బ్రహ్మనిర్వాణం ఋషయః క్షీణకల్మషాః ।\nఛిన్నద్వైధా యతాత్మానః సర్వభూతహితే రతాః ॥",
"కామక్రోధ వియుక్తానాం యతీనాం యతచేతసామ్ |\nఅభితో బ్రహ్మనిర్వాణం వర్తతే విదితాత్మనామ్ ॥",
"స్పర్శానకృత్వా బహిర్బాహ్యాన్ చక్షుశ్చైవాంతరే భ్రువోః ।\nప్రాణాపానౌ సమౌ కృత్వా నాసాభ్యంతరచారిణె ॥",
"యతేంద్రియ మనోబుద్ధిః మునిర్మోక్షపరాయణః |\nవిగతేచ్ఛా భయక్రోధః య స్సదా ముక్త ఏవ సః ॥",
"భోక్తారం యజ్ఞ తపసాం సర్వలోక మహేశ్వరమ్ |\nసుహృదం సర్వభూతానాం జ్ఞాత్వా మాం శాంతి మృచ్ఛతి॥\n\nఓం తత్సదితి, శ్రీమద్భగవద్గీతాసు, ఉపనిషత్సు,\nబ్రహ్మవిద్యాయాం, యోగశాస్త్రే, శ్రీకృష్ణార్జున సంవాదే,\nకర్మసన్న్యాసయోగోనామ పంచమోధ్యాయః"
]},
6:{name:"ఆత్మ సంయమ యోగం",slokas:[
"శ్రీ భగవానువాచ:\nఅనాశ్రితః కర్మఫలం కార్యం కర్మ కరోతియః |\nస సన్న్యాసీ చ యోగీ చ న నిరగ్నిర్నచాక్రియః ॥",
"యం సన్న్యాసమితి ప్రాహుః యోగం తం విద్ధి పాండవ! |\nన హ్యసన్న్యస్త సంకల్పః యోగీ భవతి కశ్చన ॥",
"ఆరురుక్షోర్మునేర్యోగం కర్మ కారణముచ్యతే ।\nయోగారూఢస్య తస్యైవ శమః కారణముచ్యతే ॥",
"యదా హి నేంద్రియార్థేషు న కర్మస్వనుషజ్జతే ।\nసర్వసంకల్పసన్న్యాసీ యోగారూఢస్తదోచ్యతే ॥",
"ఉద్ధరేదాత్మనా  త్మానం నాత్మానమవసాదయేత్ |\nఆత్మైవ హ్యాత్మనో బంధుః ఆత్మైవ రిపురాత్మనః ॥",
"బంధురాత్మాత్మనస్తస్య యేనాత్మైవాత్మనా జితః ।\nఅనాత్మనస్తు శత్రుత్వే వర్తేతాత్మైవ శత్రువత్ ॥",
"జితాత్మనః ప్రశాంతస్య పరమాత్మా సమాహితః ।\nశీతోష్ణ సుఖదుఃఖేషు తథా మానాపమానయోః ॥",
"జ్ఞానవిజ్ఞానతృప్తాత్మా కూటస్లో విజితేంద్రియః |\nయుక్త ఇత్యుచ్యతే యోగీ సమలోష్టాశ్మ కాంచనః ॥",
"సుహృన్మిత్రార్యదాసీన మధ్యస్థ ద్వేష్య బంధుషు |\nసాధుష్వపి చ పాపేషు సమబుద్ధి ర్విశిష్యతే ॥",
"యోగీ యుంజీత సతతం ఆత్మానం రహసి స్థితః |\nఏకాకీ యతచిత్తాత్మా నిరాశీరపరిగ్రహః ॥",
"శుచౌ దేశే ప్రతిష్ఠాప్య స్థిరమాసనమాత్మనః |\nనాత్యుఛ్ఛితం నాతినీచం చైలాజినకుశోత్తరమ్ ॥",
"తత్రైకాగ్రం మనః కృత్వా యతచిత్తేంద్రియక్రియః |\nఉపవిశ్యాసనే యుంజ్యాత్ యోగమాత్మ విశుద్ధయే ॥",
"సమం కాయశిరోగ్రీవం ధారయన్నచలం స్థిరః |\nసంప్రేక్ష్య నాసికాగ్రం స్వం దిశశ్చానవలోకయన్ ॥",
"ప్రశాంతాత్మా విగతభీః బ్రహ్మచారివ్రతే స్థితః |\nమనస్సంయమ్య మచ్చిత్తః యుక్త ఆసీత మత్పరః ॥",
"యుంజన్నేవం సదా  త్మానం యోగీ నియతమానసః |\nశాంతిం నిర్వాణపరమాం మత్సంస్థామధిగచ్ఛతి ॥",
"నాత్యశ్నతస్తు యోగోస్తి నచైకాంతమనశ్నతః ।\nన చాతిస్వప్నశీలస్య జాగ్రతో నైవ చార్జున! ॥",
"యుక్తాహారవిహారస్య యుక్త చేష్టస్య కర్మసు! |\nయుక్తస్వప్నావబోధస్య యోగో భవతి దుఃఖహా ॥",
"యదా వినియతం చిత్తం ఆత్మన్యేవావతిష్ఠతే ।\nనిస్స్పృహ స్సర్వకామేభ్యః యుక్త ఇత్యుచ్యతే తదా ॥",
"యథా దీపో నివాతస్థః నేంగతే సోపమా స్మృతా |\nయోగినో యతచిత్తస్య యుంజతో యోగమాత్మనః ॥",
"యత్రోపరమతే చిత్తం నిరుద్ధం యోగసేవయా |\nయత్ర చైవాత్మనా త్మానం పశ్యన్నాత్మని తుష్యతి ॥",
"సుఖమాత్యంతికం యత్తత్ బుద్ధిగ్రాహ్యమతీంద్రియమ్ |\nవేత్తి యత్ర న చైవాయం స్థితశ్చలతి తత్త్వతః ॥",
"యం లబ్ధ్వా చాపరం లాభం మన్యతే నాధికం తతః |\nయస్మిన్ స్థితో న దుఃఖేన గురుణాపి విచాల్యతే ॥",
"తం విద్యాద్దుఃఖసంయోగ వియోగం యోగసంజ్ఞితమ్ |\nస నిశ్చయేన యోక్తవ్యః యోగో నిర్విణ్ణచేతసా ॥",
"సంకల్పప్రభవాన్ కామాన్ త్యక్త్వా సర్వానశేషతః ।\nమనసైవేంద్రియగ్రామం వినియమ్య సమంతతః ॥",
"శనై శ్శనైరుపరమేత్ బుద్ధ్యా ధృతిగృహీతయా |\nఆత్మసంస్థం మనః కృత్వా న కించిదపి చింతయేత్ ॥",
"యతో యతో నిశ్చరతి మనశ్చంచల మస్దిరమ్ |\nతతస్తతో నియమ్యైతత్ ఆత్మన్యేవ వశం నయేత్ ॥",
"ప్రశాంతమనసం హ్యేనం యోగినం సుఖముత్తమమ్ |\nఉపైతి శాంతరజసం బ్రహ్మభూత మకల్మషమ్ ॥",
"యుంజన్నేవం సదా 2 త్మానం యోగీ విగతకల్మషః |\nసుఖేన బ్రహ్మసంస్పర్శం అత్యంతం సుఖమశ్నుతే ॥",
"సర్వభూతస్థమాత్మానం సర్వభూతాని చాత్మని |\nఈక్షతే యోగయుక్తాత్మా సర్వత్ర సమదర్శనః ॥",
"యో మాం పశ్యతి సర్వత్ర సర్వం చ మయి పశ్యతి |\nతస్యాహం న ప్రణశ్యామి స చ మే న ప్రణశ్యతి ॥",
"సర్వభూతస్థితం యో మాం భజత్యేకత్వమాస్థితః |\nసర్వథా వర్తమానోపి స యోగీ మయి వర్తతే ॥",
"ఆత్మౌపమ్యేన సర్వత్ర సమం పశ్యతి యోర్జున! |\nసుఖం వా యది వా దుఃఖం స యోగీ పరమో మతః ॥",
"అర్జున ఉవాచ:\nయోయం యోగస్త్వయా ప్రోక్తః సామ్యేన మధుసూదన!|\nఏతస్యాహం న పశ్యామి చంచలత్వాత్ఫితిం స్థిరామ్ ॥",
"చంచలం హి మనః కృష్ణ! ప్రమాథి బలవద్దృఢమ్ |\nతస్యాహం నిగ్రహం మన్యే వాయోరివ సుదుష్కరమ్ ॥",
"శ్రీ భగవానువాచ:\nఅసంశయం మహాబాహో! మనో దుర్నిగ్రహం చలమ్ |\nఅభ్యాసేన తు కౌంతేయ వైరాగ్యేణ చ గృహ్యతే ॥",
"అసంయతాత్మనా యోగః దుష్ప్రప ఇతి మే మతిః |\nవశ్యాత్మనా తు యతతా శక్యో వాప్తుముపాయతః ॥",
"అర్జున ఉవాచ:\nఅయతి శ్రద్ధయోపేతః యోగా చ్చలిత మానసః |\nఅప్రాప్య యోగసంసిద్ధిం కాం గతిం కృష్ణ! గచ్ఛతి ॥",
"కచ్చిన్నో భయవిభ్రష్టః ఛిన్నా భ్రమివ నశ్యతి |\nఅప్రతిష్తో మహాబాహో! విమూఢ బ్రహ్మణః పథి ॥",
"ఏతన్మే సంశయం కృష్ణ! ఛేత్తు మర్హస్యశేషతః ।\nత్వదన్య స్సంశయస్యాస్య ఛేత్తా న హ్యుపపద్యతే ॥",
"శ్రీ భగవానువాచ:\nపార్థ! నైవేహ నాముత్ర వినాశస్తస్య విద్యతే ।\nన హి కల్యాణకృత్కశ్చిత్ దుర్గతిం తాత! గచ్ఛతి ॥",
"ప్రాప్య పుణ్యకృతాం లోకాన్ ఉషిత్వా శాశ్వతీ స్సమాః |\nశుచీనాం శ్రీమతాం గేహే యోగభ్రష్టోలి భిజాయతే ॥",
"అథవా యోగినామేవ కులే భవతి ధీమతామ్ |\nఏతద్ధి దుర్లభతరం లోకే జన్మ యదీదృశమ్ ॥",
"తత్ర తం బుద్ధిసంయోగం లభతే పౌర్వదేహికమ్ |\nయతతే చ తతో భూయః సంసిద్ధా కురునందన ॥",
"పూర్వాభ్యాసేన తేనైవ ప్రియతే హ్యవశోపి సః |\nజిజ్ఞాసురపియోగస్య శబ్దబ్రహ్మాతివర్తతే ॥",
"ప్రయత్నాద్యతమానస్తు యోగీ సంశుద్ధకిల్బిషః |\nఅనేకజన్మ సంసిద్ధః తతో యాతి పరాం గతిమ్ ॥",
"తపస్విభ్యో ధికో యోగీ జ్ఞానిభ్యో పి మతోధికః |\nకర్మభ్యశ్చాధికో యోగీ తస్మాద్యోగీ భవార్జున! ॥",
"యోగినామపి సర్వేషాం మద్దతేనాంతరాత్మనా!|\nశ్రద్ధావాన్ భజతే యో మాం స మే యుక్తతమో మతః ॥\n\nఓం తత్సదితి, శ్రీమద్భగవద్గీతాసు, ఉపనిషత్సు,\nబ్రహ్మవిద్యాయాం, యోగశాస్త్రే, శ్రీకృష్ణార్జున సంవాదే,\nఆత్మసంయమయోగోనామ షష్టో ధ్యాయః"
]},
7:{name:"జ్ఞాన విజ్ఞాన యోగం",slokas:[
"శ్రీభగవానువాచ:\nమయ్యాసక్తమనాః పార్థ! యోగం యుంజన్ మదాశ్రయః |\nఅసంశయం సమగ్రం మాం యథా జ్ఞాస్యసి తచ్ఛృణు ॥",
"జ్ఞానం తేహం సవిజ్ఞానం ఇదం వక్ష్యామ్యశేషతః ।\nయజ్ఞాత్వా నేహ భూయో న్యత్ జ్ఞాతవ్య మవశిష్యతే ॥",
"మనుష్యాణాం సహస్రేషు కశ్చిద్యతతి సిద్ధయే ।\nయతతామపి సిద్ధానాం కశ్చిన్మాం వేత్తి తత్త్వతః ॥",
"భూమిరాపో నలో వాయుః ఖం మనో బుద్ధిరేవ చ |\nఅహంకార ఇతీయం మే భిన్నా ప్రకృతిరష్టధా ॥",
"అపరేయ మితస్త్వన్యాం ప్రకృతిం విద్ధి మే పరామ్ ।\nజీవభూతాం మహాబాహో! యయేదం ధార్యతే జగత్॥",
"ఏతద్యోనీని భూతాని సర్వాణీత్యుపధారయ ।\nఅహం కృత్స్నస్య జగతః ప్రభవః ప్రలయస్తథా ॥",
"మత్తః పరతరం నాన్యత్ కించిదస్తి ధనంజయ! |\nమయి సర్వమిదం ప్రోతం సూత్రే మణిగణా ఇవ ॥",
"రసోహమప్పు కౌంతేయ! ప్రభాస్మి శశిసూర్యయోః ।\nప్రణవ స్సర్వవేదేషు శబ్దః ఖే పౌరుషం నృషు ॥",
"పుణ్యో గంధః పృథివ్యాం చ తేజశ్చాస్మి విభావసౌ |\nజీవనం సర్వభూతేషు తపశ్చాస్మి తపస్విషు ॥",
"బీజం మాం సర్వభూతానాం విద్ధి పార్థ! సనాతనమ్ |\nబుద్ధిర్బుద్ధిమతామస్మి తేజస్తేజస్వినామహమ్ ॥",
"బలం బలవతాం చాహం కామరాగవివర్జితమ్ ।\nధర్మావిరుద్ధో భూతేషు కామో స్మి భరతర్షభ ॥",
"యే చైవ సాత్త్వికా భావాః రాజసా స్తామసాశ్చయే ।\nమత్త ఏవేతి తాన్విద్ధి న త్వహం తేషు తే మయి ॥",
"త్రిభిర్గుణమయైర్భావైః ఏభి స్సర్వమిదం జగత్ |\nమోహితం నాభిజానాతి మామేభ్యః పరమవ్యయమ్ ॥",
"దైవీ హ్యేషా గుణమయీ మమ మాయా దురత్యయా |\nమామేవ యే ప్రపద్యంతే మాయామేతాం తరంతి తే ॥",
"న మాం దుష్కృతినో మూఢాః ప్రపద్యంతే నరాధమాః ।\nమాయయా పహృతజ్ఞానాః ఆసురం భావమాశ్రితాః ॥",
"చతుర్విధా భజంతే మాం జనా సుకృతినోర్జున!|\nఆర్తో జిజ్ఞాసురర్ధార్థీ జ్ఞానీ చ భరతర్షభ! ॥",
"తేషాం జ్ఞానీ నిత్యయుక్తః ఏక భక్తిర్విశిష్యతే |\nప్రియో హి జ్ఞానినో త్యర్థం అహం స చ మమ ప్రియః ॥",
"ఉదారా స్సర్వ ఏవైతే జ్ఞానీ త్వాత్మైవ మే మతమ్ ।\nఆస్థిత స్స హి యుక్తాత్మా మామేవానుత్తమాం గతిమ్ ॥",
"బహూనాం జన్మనామంతే జ్ఞానవాన్ మాం ప్రపద్యతే |\nవాసుదేవ స్సర్వమితి స మహాత్మా సుదుర్లభః ॥",
"కామైసైసైర్ఘృతజ్ఞానాః ప్రపద్యంతే న్యదేవతాః ।\nతం తం నియమమాస్థాయ ప్రకృత్యా నియతా స్స్వయా ॥",
"యో యో యాంయాంతనుం భక్తః శ్రద్ధయా ర్చితుమిచ్ఛతి।\nతస్య తస్యాచలాం శ్రద్ధాం తామేవ విదధామ్యహమ్॥",
"స తయా శ్రద్ధయా యుక్తః తస్యారాధన మీహతే |\nలభతే చ తతః కామాన్ మయైవ విహితాన్ హి తాఫ్ ॥",
"అంతవత్తు ఫలం తేషాం తద్భవత్యల్పమేధసామ్ ।\nదేవాన్ దేవయజో యాంతి మద్భక్తా యాంతి మామపి ॥",
"అవ్యక్తం వ్యక్తిమాపన్నం మన్యంతే మామబుద్ధయః |\nపరం భావమజానంతః మమావ్యయమనుత్తమమ్ ॥",
"నాహం ప్రకాశ స్సర్వస్య యోగమాయా సమావృతః ।\nమూడో యం నాభిజానాతి లోకో మామజమవ్యయమ్ ॥",
"వేదాహం సమతీతాని వర్తమానాని చార్జున! |\nభవిష్యాణి చ భూతాని మాం తు వేద న కశ్చన ॥",
"ఇచ్ఛాద్వేష సముత్థాన ద్వంద్వమోహేన భారత! |\nసర్వభూతాని సమ్మోహం సర్గే యాంతి పరంతప! ॥",
"యేషాం త్వంతగతం పాపం జనానాం పుణ్యకర్మణామ్ |\nతే ద్వంద్వమోహనిర్ముక్తాః భజంతే మాం దృఢవ్రతాః ॥",
"జరామరణ మోక్షాయ మామాశ్రిత్య యతంతి యే|\nతే బ్రహ్మ తద్విదుః కృత్స్నం అధ్యాత్మం కర్మ చాఖిలమ్ ॥",
"సాధిభూతాధిదైవం మాం సాధియజ్ఞం చ యే విదుః |\nప్రయాణకాలే పి చ మాం తే విదుర్యుక్తచేతసః ॥\n\nఓం తత్సదితి, శ్రీమద్భగవద్గీతాసు, ఉపనిషత్సు,\nబ్రహ్మవిద్యాయాం, యోగశాస్త్రే, శ్రీకృష్ణార్జున సంవాదే,\nజ్ఞానవిజ్ఞానయోగోనామ సప్తమో ధ్యాయః"
]},
8:{name:"అక్షర బ్రహ్మ యోగం",slokas:[
"అర్జున ఉవాచ:\nకిం తర్ద్రహ్మ కిమధ్యాత్మం కిం కర్మ పురుషోత్తమ! |\nఅధిభూతం చ కిం ప్రోక్తం అధిదైవం కిముచ్యతే ॥",
"అధియజ్ఞః కథం కోత్ర దేహే స్మిన్ మధుసూదన! |\n\nప్రయాణకాలే చ కథం జ్ఞేయో సి నియతాత్మభిః ॥",
"శ్రీభగవానువాచ:\nఅక్షరం బ్రహ్మ పరమం స్వభావో ధ్యాత్మముచ్యతే |\nభూతభావోద్భవకరః విసర్గః కర్మ సంజ్ఞితః ॥",
"అధిభూతం క్షరో భావః పురుషశ్చాధిదైవతమ్ |\nఅధియజ్ఞో హమేవాత్ర దేహే దేహభృతాం వర! ॥",
"అంతకాలే చ మామేవ స్మరన్ ముక్త్వా కలేవరమ్ |\nయః ప్రయాతి స మద్భావం యాతి నాస్త్యత్ర సంశయః ॥",
"యంయం వాపి స్మరన్ భావం త్యజత్యంతే కలేవరమ్|\nతం తమేవైతి కౌంతేయ సదా తద్భావభావితః ॥",
"తస్మాత్సర్వేషు కాలేషు మామనుస్మర యుధ్య చ |\nమయ్యర్పిత మనోబుద్ధిః మామేవైష్యస్యసంశయః ॥",
"అభ్యాసయోగయుక్తేన చేతసా నాన్యగామినా ।\nపరమం పురుషం దివ్యం యాతి పార్థానుచింతయన్ ॥",
"కవిం పురాణమనుశాసితారం\nఅణోరణీయాంసమనుస్మరేద్యః |\nసర్వస్య ధాతారమచింత్యరూపం\nఆదిత్యవర్ణం తమసః పరస్తాత్ ॥",
"ప్రయాణకాలే మనసా చలేన\nభక్త్యా యుక్తో యోగబలేన చైవ |\nభ్రువోర్మధ్యే ప్రాణమావేశ్య సమ్యక్\nసతం పరం పురుషము పైతి దివ్యమ్ ॥",
"యదక్షరం వేదవిదో వదంతి\nవిశంతి యద్యతయో వీతరాగాః |\nయదిచ్ఛంతో బ్రహ్మచర్యం చరంతి\nతత్తే పదం సంగ్రహేణ ప్రవక్ష్యే ॥",
"సర్వద్వారాణి సంయమ్య మనో హృది నిరుధ్యచ |\nమూర్ధ్యాధాయాత్మనః ప్రాణం ఆస్థితో యోగధారణామ్ ॥",
"ఓమిత్యేకాక్షరం బ్రహ్మ వ్యాహరన్ మామనుస్మరన్ ।\nయః ప్రయాతి త్యజన్ దేహం స యాతి పరమాం గతిమ్ ॥",
"అనన్యచేతా స్సతతం యో మాం స్మరతి నిత్యశః |\nతస్యాహం సులభః పార్థ! నిత్యయుక్తస్య యోగినః ॥",
"మాముపేత్య పునర్జన్మ దుఃఖాలయ మశాశ్వతమ్ |\nనాప్నువంతి మహాత్మానః సంసిద్ధిం పరమాం గతాః ॥",
"ఆబ్రహ్మభువనాల్లోకాః పునరావర్తినోర్జున! |\nమాముపేత్య తు కౌంతేయ! పునర్జన్మ న విద్యతే ॥",
"సహస్రయుగ పర్యంతం అహర్యద్బహ్మణో విదుః |\nరాత్రిం యుగ సహస్రాంతాం తే హోరాత్రవిదో జనాః ॥",
"అవ్యక్తాద్వ్యక్తయ స్సర్వాః ప్రభవంత్యహరాగమే |\nరాత్ర్యాగమే ప్రలీయంతే తత్రైవావ్యక్త సంజ్ఞకే ॥",
"భూతగ్రామ స్స ఏవాయం భూత్వా భూత్వా ప్రలీయతే |\nరాత్రాగమే వశః పార్థ! ప్రభవత్యహరాగమే ॥",
"పరస్తస్మాత్తు భావో న్యః అవ్యక్తో వ్యక్తాత్సనాతనః |\nయస్స సర్వేషు భూతేషు నశ్యత్సు న వినశ్యతి ॥",
"అవ్యక్తో క్షర ఇత్యుక్తః తమాహుః పరమాం గతిమ్ |\nయం ప్రాప్య న నివర్తంతే తద్ధామ పరమం మమ ॥",
"పురుషస్స పరః పార్థ! భక్త్యా లభ్యస్త్వనన్యయా ।\nయస్యాంతస్థాని భూతాని యేన సర్వమిదం తతమ్ ॥",
"యత్ర కాలే త్వనావృత్తిం ఆవృత్తిం చైవ యోగినః ।\nప్రయాతా యాంతి తం కాలం వక్ష్యామి భరతర్షభ! ॥",
"అగ్నిర్ణ్యోతిరహ శుక్లః షణ్మాసా ఉత్తరాయణమ్ |\nతత్ర ప్రయాతా గచ్ఛంతి బ్రహ్మ బ్రహ్మవిదో జనాః ॥",
"ధూమో రాత్రిస్తథా కృష్ణః షణ్మాసా దక్షిణాయనమ్ |\nతత్ర చాంద్రమసం జ్యోతిః యోగీ ప్రాప్య నివర్తతే ॥",
"శుక్లకృష్ణ గతీ హ్యేతే జగత శ్శాశ్వతే మతే |\nఏకయా యాత్యనావృత్తిం అన్యయా  వర్తతే పునః ॥",
"నైతే సృతీ పార్థ! జానన్ యోగీ ముహ్యతి కశ్చన |\nతస్మాత్సర్వేషు కాలేషు యోగయుక్తో భవార్జున! ॥",
"వేదేషు యజ్ఞేషు తపస్సు చైవ\nదానేషు యత్పుణ్యఫలం ప్రదిష్టమ్ |\nఅత్యేతి తత్సర్వమిదం విదిత్వా\nయోగీ పరం స్థానముపైతి చాద్యమ్ ॥\n\nఓం తత్సదితి, శ్రీమద్భగవద్గీతాసు, ఉపనిషత్సు,\nబ్రహ్మవిద్యాయాం, యోగశాస్త్రే, శ్రీకృష్ణార్జున సంవాదే,\nఅక్షరపరబ్రహ్మయోగోనామ అష్టమో ధ్యాయః"]},
9:{name:"రాజ విద్య రాజ గుహ్య యోగం",slokas:[
"శ్రీభగవానువాచ:\nఇదం తు తే గుహ్యతమం ప్రవక్ష్యామ్యనసూయవే |\nజ్ఞానం విజ్ఞాన సహితం యజ్జ్ఞాత్వా మోక్ష్యసే శుభాత్॥",
"రాజవిద్యా రాజగుహ్యం పవిత్రమిదముత్తమమ్ |\nప్రత్యక్షావగమం ధర్మ్యం సు సుఖం కర్తుమవ్యయమ్ ॥",
"అశ్రద్దధానః పురుషాః ధర్మస్యాస్య పరంతప! |\nఅప్రాప్య మాం నివర్తంతే మృత్యుసంసారవర్త్మని ॥",
"మయా తతమిదం సర్వం జగదవ్యక్తమూర్తినా |\nమతాని సర్వభూతాని న చాహం తేష్వవస్థితః ॥",
"న చ మతాస్థాని భూతాని పశ్య మే యోగమైశ్వరమ్ |\nభూతభృన్న చ భూతస్థః మమాత్మా భూతభావనః ॥",
"యథా కాశస్థితో నిత్యం వాయు స్సర్వత్రగో మహాన్ |\nతథా సర్వాణి భూతాని మత్స్థానీత్యుపధారయ ॥",
"సర్వభూతాని కౌంతేయ! ప్రకృతిం యాంతి మామికామ్ |\nకల్పక్షయే పునస్తాని కల్పాదౌ విసృజామ్యహమ్ ॥",
"ప్రకృతిం స్వామవష్టభ్య విసృజామి పునః పునః |\nభూతగ్రామమిమం కృత్స్నం అవశం ప్రకృతేర్వశాత్ ॥",
"న చ మాం తాని కర్మాణి నిబధ్నంతి ధనంజయ! |\nఉదాసీనవదాసీనం అసక్తం తేషు కర్మసు ॥",
"మయా ధ్యక్షేణ ప్రకృతిః సూయతే స చరాచరమ్ |\nహేతునానేన కౌంతేయ! జగద్విపరివర్తతే ॥",
"అవజానంతి మాం మూఢాః మానుషీం తనుమాశ్రితమ్ |\nపరం భావమజానంతః మమ భూతమహేశ్వరమ్ ॥",
"మోఘాశా మోఘకర్మాణః మోఘజ్ఞానా విచేతసః |\nరాక్షసీమాసురీం చైవ ప్రకృతిం మోహినీం శ్రితాః ॥",
"మహాత్మానస్తు మాం పార్థ! దైవీం ప్రకృతి మాశ్రితాః ।\nభజంత్యనన్యమనసః జ్ఞాత్వా భూతాది మవ్యయమ్ ॥",
"సతతం కీర్తయంతో మాం యతంతశ్చ దృఢవ్రతాః ।\nనమస్యంతశ్చ మాం భక్త్యా నిత్యయుక్తా ఉపాసతే ॥",
"జ్ఞానయజ్ఞేన చాప్యన్యే యజంతో మాముపాసతే |\nఏకత్వేన పృథక్త్వేన బహుధా విశ్వతోముఖమ్ ॥",
"అహం క్రతురహం యజ్ఞః స్వధా హ మహమౌషధమ్ |\nమంత్రోహ మహమేవాజ్యం అహమగ్నిరహం హుతమ్॥",
"పితా హమస్య జగతః మాతా ధాతా పితామహః |\nవేద్యం పవిత్రమోంకారః ఋక్సామ యజురేవ చ ॥",
"గతిర్భర్తా ప్రభుస్సాక్షీ నివాస శ్శరణం సుహృత్ |\nప్రభవః ప్రలయ స్థానం నిధానం బీజమవ్యయమ్ ॥",
"తపామ్యహమహం వర్షం నిగృహమ్యుత్సృజామి చ |\nఅమృతం చైవ మృత్యుశ్చ సదసచ్చాహమర్జున! ॥",
"త్రైవిద్యా మాం సోమపాః పూతపాపాః\nయజ్ఞరిష్ట్వా స్వర్గతిం ప్రార్థయంతే |\nతే పుణ్యమాసాద్య సురేంద్రలోకం\nఅశ్నంతి దివ్యాన్ దివి దేవభోగాన్ ॥",
"తే తం భుక్త్వా స్వర్గలోకం విశాలం\nక్షీణే పుణ్యే మర్త్యలోకం విశంతి |\nఏవం త్రయీధర్మమనుప్రపన్నాః\nగతాగతం కామకామా లభంతే ॥",
"అనన్యాశ్చింతయంతో మాం యే జనాః పర్యుపాసతే !|\nతేషాం నిత్యాభియుక్తానాం యోగక్షేమం వహామ్యహమ్॥",
"యే ప్యన్యదేవతా భక్తాః యజంతే శ్రద్ధయాన్వితాః |\nతే పి మామేవ కౌంతేయ యజంత్యవిధిపూర్వకమ్ ॥",
"అహం హి సర్వయజ్ఞానాం భోక్తా చ ప్రభురేవ చ |\nన తు మామభిజానంతి తత్త్వేనాతశ్చ్యవంతి తే ॥",
"యాంతి దేవవ్రతా దేవాన్\nపితౄన్ యాంతి పితృవ్రతాః ।\nభూతాని యాంతి భూతేజ్యాః\nయాంతి మద్యాజినోపి మామ్ ॥",
"పత్రం పుష్పం ఫలం తోయం యో మే భక్త్యా ప్రయచ్ఛతి |\nతదహం భక్త్యుపహృతం అశ్నామి ప్రయతాత్మనః ॥",
"యత్కరోషి యదశ్నాసి యజ్ఞహోషి దదాసి యత్ |\nయత్తపస్యసి కౌంతేయ! తత్కురుష్వ మదర్పణమ్ ॥",
"శుభాశుభఫలైరేవం మోక్ష్యసే కర్మబంధనైః |\nసన్న్యాసయోగయుక్తాత్మా విముక్తో మాముపైష్యసి ॥",
"సమో హం సర్వభూతేషు న మే ద్వేష్యోస్తి న ప్రియః|\nయే భజంతి తు మాం భక్త్యా మయి తే తేషు చాప్యహమ్॥",
"అపి చేత్సుదురాచారః భజతే మామనన్యభాక్ ।\nసాధురేవ స మంతవ్యః సమ్యగ్వ్యవసితో హి సః ॥",
"క్షిప్రం భవతి ధర్మాత్మా శశ్వచ్ఛాంతిం నిగచ్ఛతి ।\nకౌంతేయ! ప్రతిజానీహి న మే భక్తః ప్రణశ్యతి ॥",
"మాం హి పార్థ! వ్యపాశ్రిత్య యేపి స్యుః పాపయోనయః |\nస్త్రియో వైశ్యాస్తథా శూద్రాః తే పి యాంతి పరాం గతిమ్॥",
"కిం పునర్రాహ్మణాః పుణ్యాః భక్తా రాజర్షయస్తథా |\nఅనిత్యమసుఖం లోకం ఇమం ప్రాప్య భజస్వ మామ్॥",
"మన్మనా భవ మద్భక్తః మద్యాజీ మాం నమస్కురు |\nమామేవైష్యసి యుక్వైవం ఆత్మానం మత్పరాయణః ॥\n\nఓం తత్సదితి, శ్రీమద్భగవద్గీతాసు, ఉపనిషత్సు,\nబ్రహ్మవిద్యాయాం, యోగశాస్త్రే, శ్రీకృష్ణార్జున సంవాదే,\nరాజవిద్యారాజగుహ్యయోగోనామ నవమో ధ్యాయః"]},
10:{name:"విభూతి యోగం",slokas:[
"శ్రీభగవానువాచ:\nభూయ ఏవ మహాబాహో! శృణు మే పరమం వచః |\nయత్తే హం ప్రియమాణాయ వక్ష్యామి హితకామ్యయా ॥",
"న మే విదు స్సురగణాః ప్రభవం న మహర్షయః |\nఅహమాదిర్హి దేవానాం మహర్షీణాం చ సర్వశః ॥",
"యో మామజమనాదిం చ వేత్తి లోకమహేశ్వరమ్ |\nఅసమ్మూఢ స్స మర్త్యేషు సర్వపాపైః ప్రముచ్యతే ॥",
"బుద్ధిర్ జ్ఞాన మసమ్మోహః క్షమా సత్యం దమ శ్శమః |\nసుఖం దుఃఖం భవో భావః భయం చాభయమేవ చ ॥",
"అహింసా సమతా తుష్టిః తపో దానం యశో యశః |\nభవంతి భావా భూతానాం మత్త ఏవ పృథగ్విధాః ॥",
"మహర్షయ స్సప్త పూర్వే చత్వారో మనవస్తథా |\nమద్భావా మానసా జాతాః యేషాం లోక ఇమాః ప్రజాః ॥",
"ఏతాం విభూతిం యోగం చ మమ యో వేత్తి తత్త్వతః |\nసో వికంపేన యోగేన యుజ్యతే నాత్ర సంశయః ॥",
"అహం సర్వస్య ప్రభవః మత్తస్సర్వం ప్రవర్తతే |\nఇతి మత్వా భజంతే మాం బుధా భావసమన్వితాః ॥",
"మచ్చిత్తా మద్గత ప్రాణాః బోధయంతః పరస్పరమ్ |\nకథయంతశ్చ మాం నిత్యం తుష్యంతి చ రమంతి చ ॥",
"తేషాం సతతయుక్తానాం భజతాం ప్రీతిపూర్వకమ్ |\nదదామి బుద్ధియోగం తం యేన మాముపయాంతి తే ॥",
"తేషామేవానుకంపార్థం అహమజ్ఞానజం తమః |\nనాశయామ్యాత్మభావస్థః జ్ఞానదీపేన భాస్వతా ॥",
"అర్జున ఉవాచ:\nపరం బ్రహ్మ పరం ధామ పవిత్రం పరమం భవాన్|\nపురుషం శాశ్వతం దివ్యం ఆదిదేవమజం విభుమ్ ॥",
"ఆహుస్త్వామృషయ స్సర్వే దేవర్షిర్నారదస్తథా |\nఅసితో దేవలో వ్యాసః స్వయం చైవ బ్రవీషి మే ॥",
"సర్వమేత దృతం మన్యే యన్మాం వదసి కేశవ!|\nన హి తే భగవన్! వ్యక్తిం విదుర్దేవా న దానవాః ॥",
"స్వయమేవాత్మనా త్మానం వేత్థ త్వం పురుషోత్తమ!|\nభూతభావన! భూతేశ! దేవ దేవ! జగత్పతే! ॥",
"వక్తుమర్హస్యశేషేణ దివ్యా హ్యాత్మవిభూతయః ।\nయాభి ర్విభూతిభిర్లోకాన్ ఇమాంస్త్వం వ్యాప్య తిష్ఠసి ॥",
"కథం విద్యామహం యోగిన్ త్వాం సదా పరిచింతయన్ |\nకేషు కేషు చ భావేషు చింత్యో సి భగవన్! మయా ॥",
"విస్తరేణాత్మనో యోగం విభూతిం చ జనార్దన!|\nభూయః కథయ తృప్తిర్షి శృణ్వతో నాస్తి మే మృతమ్ ॥",
"శ్రీభగవానువాచ:\nహంత తే కథయిష్యామి దివ్యాహ్యాత్మవిభూతయః |\nప్రాధాన్యతః కురుశ్రేష్ఠ! నాస్త్యంతో విస్తరస్య మే ॥",
"అహమాత్మా గుడాకేశ! సర్వభూతాశయస్థితః |\nఅహమాదిశ్చ మధ్యం చ భూతానామంత ఏవ చ ॥",
"ఆదిత్యానామహం విష్ణుః జ్యోతిషాం రవిరంశుమాన్ |\nమరీచిర్మరుతామస్మి నక్షత్రాణా మహం శశీ ॥",
"వేదానాం సామవేదోస్మి దేవానామస్మి వాసవః |\nఇంద్రియాణాం మనశ్చాస్మి భూతానామస్మి చేతనా ॥",
"రుద్రాణాం శంకరశ్చాస్మి విత్తేశో యక్షరక్షసామ్ |\nవసూనాం పావకశ్చాస్మి మేరు శ్శిఖరిణా మహమ్ ॥",
"పురోధసాం చ ముఖ్యం మాం విద్ధి పార్థ! బృహస్పతిమ్ |\nసేనానీనామహం స్కందః సరసామస్మి సాగరః ॥",
"మహర్షీణాం భృగురహం గిరామస్మ్యేకమక్షరమ్ |\nయజ్ఞానాం జపయజ్ఞోని స్మి స్థావరాణాం హిమాలయః ॥",
"అశ్వత్థ స్సర్వవృక్షాణాం దేవర్షీణాం చ నారదః |\nగంధర్వాణాం చిత్రరథః సిద్ధానాం కపిలో మునిః ॥",
"ఉచ్చైశ్రవసమశ్వానాం విద్ధి మామమృతోద్భవమ్ ।\nఐరావతం గజేంద్రాణాం నరాణాం చ నరాధిపమ్ ॥",
"ఆయుధానా మహం వజ్రం ధేనూనామస్మి కామధుక్ |\nప్రజనశ్చాస్మి కందర్పః సర్పాణామస్మి వాసుకిః ॥",
"అనంతశ్చాస్మి నాగానాం వరుణో యాదసామహమ్ |\nపితృణామర్యమా చాస్మి యమ స్సంయమతామహమ్ ॥",
"ప్రహ్లాదశ్చాస్మి దైత్యానాం కాలః కలయతామహమ్ |\nమృగాణాం చ మృగేంద్రోహం వైనతేయశ్చ పక్షిణామ్॥",
"పవనః పవతామస్మి రామశ్శస్త్రభృతామహమ్ |\nఝషాణాం మకరశ్చాస్మి స్రోతసామస్మి జాహ్నవీ ॥",
"సర్గాణామాదిరంతశ్చ మధ్యం చైవాహమర్జున! |\nఅధ్యాత్మవిద్యా విద్యానాం వాదః ప్రవదతామహమ్ ॥",
"అక్షరాణామకారో స్మి ద్వంద్వ స్సామాసికస్య చ |\nఅహమేవాక్షయః కాలః ధాతా హం విశ్వతోముఖః ॥",
"మృత్యు స్సర్వహరశ్చాహం ఉద్భవశ్చ భవిష్యతామ్ |\nకీర్తి శ్రీర్వాక్చ నారీణాం స్మృతిర్మేధా ధృతిః క్షమా ॥",
"బృహత్సామ తథా సామ్నాం గాయత్రీ ఛందసామహమ్ |\nమాసానాం మార్గశీర్షి హం ఋతూనాం కుసుమాకరః ॥",
"ద్యూతం ఛలయతామస్మి తేజస్తేజస్వినామహమ్ |\nజయో స్మి వ్యవసాయో స్మి సత్త్వం సత్త్వవతామహమ్॥",
"వృష్ణానాం వాసుదేవో స్మి పాండవానాం ధనంజయః |\nమునీనామప్యహం వ్యాసః కవీనా ముశనా కవిః ॥",
"దండో దమయతామస్మి నీతిరస్మి జిగీషతామ్ |\nమౌనం చైవాస్మి గుహ్యానాం జ్ఞానం జ్ఞానవతామహమ్ ॥",
"యచ్చాపి సర్వభూతానాం బీజం తదహమర్జున!|\nన తదస్తి వినా యత్స్యాత్ మయా భూతం చరాచరమ్ ॥",
"నాంతోస్తి మమ దివ్యానాం విభూతీనాం పరంతప!|\nఏషతూద్దేశతః ప్రోక్తః విభూతేర్విస్తరో మయా ॥",
"యద్యద్విభూతిమత్సత్త్వం శ్రీమదూర్జితమేవ వా |\nతత్తదేవావగచ్ఛ త్వం మమ తేజోంశ సంభవమ్ ॥",
"అథవా బహునైతేన కిం జ్ఞాతేన తవార్జున! ।\nవిష్టభ్యాహమిదం కృత్స్నం ఏకాంశేన స్థితో జగత్ ॥\n\nఓం తత్సదితి, శ్రీమద్భగవద్గీతాసు, ఉపనిషత్సు,\nబ్రహ్మవిద్యాయాం, యోగశాస్త్రే, శ్రీకృష్ణార్జున సంవాదే,\nవిభూతియోగోనామ దశమోధ్యాయః"]},
11:{name:"విశ్వరూప దర్శన యోగం",slokas:[
"అర్జున ఉవాచ:\nమదనుగ్రహాయ పరమం గుహ్యమధ్యాత్మసంజ్ఞితమ్|\nయత్త్వయోక్తం వచస్తేన మోహో యం విగతో మమ॥",
"భవాప్యయౌ హి భూతానాం శ్రుతౌ విస్తరశో మయా|\nత్వత్తః కమలపత్రాక్ష! మాహాత్మ్యమపి చావ్యయమ్॥",
"ఏవమేతద22 త త్వం ఆత్మానం పరమేశ్వర!|\nద్రష్టుమిచ్ఛామి తే రూపం ఐశ్వరం పురుషోత్తమ!॥",
"మన్యసే యది తచ్ఛక్యం మయా ద్రష్టు మితి ప్రభో!|\nయోగేశ్వర! తతో మే త్వం దర్శయాత్మాన మవ్యయమ్॥",
"శ్రీభగవానువాచ:\nపశ్య మే పార్థ! రూపాణి శతశోథ సహస్రశః|\nనానావిధాని దివ్యాని నానావర్ణాకృతీని చ॥",
"పశ్యాదిత్యాన్ వసూన్ రుద్రాన్ అశ్వినౌ మరుతస్తథా|\nబహూన్యదృష్టపూర్వాణి పశ్యాశ్చర్యాణి భారత!॥",
"ఇహైకస్థం జగత్ కృత్స్నం పశ్యాద్య సచరాచరమ్|\nమమ దేహే గుడాకేశ! యచ్చాన్యధ్ధష్టు మిచ్ఛసి ॥",
"న తు మాం శక్యసే ద్రష్టుం అనేనైవ స్వచక్షుషా|\nదివ్యం దదామి తే చక్షుః పశ్య మే యోగమైశ్వరమ్ ॥",
"సంజయ ఉవాచ:\nఏవముక్త్వా తతో రాజన్! మహాయోగేశ్వరో హరిః।\nదర్శయామాస పార్థాయ పరమం రూపమైశ్వరమ్ ॥",
"అనేక వక్త్ర నయనం అనేకాద్భుత దర్శనమ్|\nఅనేక దివ్యాభరణం దివ్యానేకోద్యతాయుధమ్ ॥",
"దివ్యమాల్యాంబరధరం దివ్యగంధానులేపనమ్|\nసర్వాశ్చర్యమయం దేవం అనంతం విశ్వతోముఖమ్॥",
"దివి సూర్యసహస్రస్య భవేద్యుగపదుద్ధితా|\nయది భాస్సదృశీ సా స్యాత్ భాసస్తస్య మహాత్మనః ॥",
"తత్రైకస్థం జగత్ కృత్స్నం ప్రవిభక్తమనేకధా|\nఅపశ్యద్దేవదేవస్య శరీరే పాండవస్తదా ॥",
"తత స్స విస్మయావిష్టః హృష్టరోమా ధనంజయః|\nప్రణమ్య శిరసా దేవం కృతాంజలిరభాషత ॥",
"అర్జున ఉవాచ :\nపశ్యామి దేవాంస్తవ దేవ! దేహే\nసర్వాంస్తథా భూతవిశేషసంఘాన్ |\nబ్రహ్మాణమీశం కమలాసనస్థం\nఋషీంశ్చ సర్వానురగాంశ్చ దివ్యాన్ ॥",
"అనేకబాహూదరవక్త్రనేత్రం\nపశ్యామి త్వా సర్వతో నంతరూపమ్|\nనాంతం న మధ్యం న పునస్తవాదిం\nపశ్యామి విశ్వేశ్వర! విశ్వరూప! ॥",
"కిరీటినం గదినం చక్రిణం చ\nతేజోరాశిం సర్వతో దీప్తిమంతమ్ |\nపశ్యామి త్వాం దుర్నిరీక్ష్యం సమంతాత్\nదీప్తానలార్క ద్యుతిమప్రమేయమ్ ॥",
"త్వమక్షరం పరమం వేదితవ్యం\nత్వమస్య విశ్వస్య పరం నిధానమ్ |\nత్వమవ్యయ శ్శాశ్వత ధర్మగోప్తా\nసనాతనస్త్వం పురుషో మతో మే ॥",
"అనాదిమధ్యాంతమనంతవీర్యం\nఅనంతబాహుం శశిసూర్యనేత్రమ్ |\nపశ్యామి త్వాం దీప్తహుతాశవక్త్రం\nస్వతేజసా విశ్వమిదం తపంతమ్ ॥",
"ద్యావా పృథివ్యోరిదమంతరం హి\nవ్యాప్తం త్వయైకేన దిశశ్చ సర్వాః |\nదృష్ట్వాద్భుతం రూపమిదం తవోగ్రం\nలోకత్రయం ప్రవ్యథితం మహాత్మన్! ॥",
"అమీ హి త్వా సురసంఘా విశంతి\nకేచిద్భీతాః ప్రాంజలయో గృణంతి |\nస్వస్తీత్యుక్త్వా మహర్షి సిద్ధసంఘాః\nస్తువంతి త్వాం స్తుతిభిః పుష్కలాభిః ॥",
"రుద్రాదిత్యా వసవో యే చ సాధ్యాః\nవిశ్వే శ్వినౌ మరుతశ్చోష్మపాశ్చ |\nగంధర్వయక్షాసురసిద్ధసంఘాః\nవీక్షంతే త్వాం విస్మితాశ్చైవ సర్వే ॥",
"రూపం మహత్తే బహువక్త్రనేత్రం\nమహాబాహో! బహుబాహూరుపాదమ్ ।\nబహూదరం బహుదంష్ట్రాకరాళం\nదృష్ట్వా లోకాః ప్రవ్యథితాస్తథా హమ్ ॥",
"నభస్స్పృశం దీప్తమనేకవర్ణం\nవ్యాత్తాననం దీప్తవిశాలనేత్రమ్ ।\nదృష్ట్వా హి త్వాం ప్రవ్యథితాంతరాత్మా\nధృతిం న విందామి శమం చ విష్ణో! ॥",
"దంష్ట్రాకరాళాని చ తే ముఖాని\nదృష్ట్వివ కాలానలసన్నిభాని ।\nదిశో న జానే న లభే చ శర్మ\nప్రసీద దేవేశ! జగన్నివాస! ॥",
"అమీ చ త్వాం ధృతరాష్ట్రస్య పుత్రాః\nసర్వే సహైవావనిపాలసంఘైః |\nభీష్మో ద్రోణ స్సూతపుత్రస్తథా సౌ\nసహాస్మదీయైరపి యోధముఖ్యైః ॥",
"వక్రాణి తే త్వరమాణా విశంతి\nదంష్ట్రాకరాళాని భయానకాని ।\nకేచిద్విలగ్నా దశనాంతరేషు\nసందృశ్యంతే చూర్ణితైరుత్తమాంగైః ॥",
"యథా నదీనాం బహవోంబువేగాః\nసముద్రమేవాభిముఖా ద్రవంతి |\nతథా తవామీ నరలోకవీరాః\nవిశంతి వక్తాణ్యభివిజ్వలంతి ॥",
"యథా ప్రదీప్తం జ్వలనం పతంగాః\nవిశంతి నాశాయ సమృద్ధవేగాః ।\nతథైవ నాశాయ విశంతి లోకాః\nతవాపి వక్రాణి సమృద్ధవేగాః ॥",
"లేలిహ్యసే గ్రసమాన స్సమంతాత్\nలోకాన్ సమగ్రాన్ వదనైర్జ్వలద్భిః |\nతేజోభిరాపూర్య జగత్సమగ్రం\nభాసస్తవోగ్రాః ప్రతపంతి విష్ణో ॥",
"ఆఖ్యాహి మే కో భవానుగ్రరూపః\nనమోస్తు తే దేవవర! ప్రసీద |\nవిజ్ఞాతు మిచ్ఛామి భవంతమాద్యం\nన హి ప్రజానామి తవ ప్రవృత్తిమ్ ॥",
"శ్రీ భగవానువాచ:\nకాలో స్మి లోకక్షయకృత్ప్రవృద్ధః\nలోకాన్ సమాహర్తుమిహ ప్రవృత్తః ।\nఋతే పి త్వా న భవిష్యంతి సర్వే\nయే వస్థితాః ప్రత్యనీకేషు యోధాః ॥",
"తస్మాత్ త్వముత్తిష్ఠ యశో లభస్వ\nజిత్వా శత్రూన్ భుంక్ష్వ రాజ్యం సమృద్ధమ్ ।\nమయైవైతే నిహతాః పూర్వమేవ\nనిమిత్తమాత్రం భవ సవ్యసాచిన్! ॥",
"ద్రోణం చ భీష్మం చ జయద్రథం చ\nకర్ణం తథా న్యానపి యోధవీరాన్ |\nమయా హతాంస్త్వం జహి మా వ్యథిష్ఠాః\nయుధ్యస్వ జేతా సి రణే సపత్నాన్ ॥",
"సంజయ ఉవాచ:\nఏతచ్ఛుత్వా వచనం కేశవస్య\nకృతాంజలిర్వేపమానః కిరీటీ |\nనమస్కృత్వా భూయ ఏవాహ కృష్ణం\nసగద్గదం భీతభీతః ప్రణమ్య ॥",
"అర్జున ఉవాచ:\nస్థానేహృషీకేశ! తవ ప్రకీర్త్యా\nజగత్ప్రహృష్యత్యనురజ్యతే చ\nరక్షాంసి భీతాని దిశో ద్రవంతి\nసర్వే నమస్యంతి చ సిద్ధసంఘాః ॥",
"కస్మాచ్చ తే న నమేరన్ మహాత్మన్!\nగరీయసే బ్రహ్మణో ప్యాదికర్తే |\nఅనంత! దేవేశ! జగన్నివాస!\nత్వమక్షరం సదసత్ తత్పరం యత్ ॥",
"త్వమాదిదేవః పురుషః పురాణః\nత్వమస్య విశ్వస్య పరం నిధానమ్ |\nవేత్తా2సి వేద్యం చ పరం చ ధామ\nత్వయా తతం విశ్వమనంతరూప! ॥",
"వాయుర్యమోగ్ని ర్వరుణ శ్శశాంకః\nప్రజాపతిస్త్వం ప్రపితామహశ్చ |\nనమో నమస్తేస్తు సహస్రకృత్వః\nపునశ్చ భూయోపి నమో నమస్తే ॥",
"నమః పురస్తాదథ పృష్ఠతస్తే\nనమోస్తు తే సర్వత ఏవ సర్వ! |\nఅనంతవీర్యామితవిక్రమస్త్వం\nసర్వం సమాప్నోషి తతో సి సర్వః ॥",
"సఖేతి మత్వా ప్రసభం యదుక్తం\nహే కృష్ణ! హే యాదవ! హే సఖేతి! ।\nఅజానతా మహిమానం తవేదం\nమయా ప్రమాదాత్ ప్రణయేన వాపి ॥",
"యచ్చాపహాసార్థమసత్కృతో సి\nవిహారశయ్యాసన భోజనేషు |\nఏకో థవా ప్యచ్యుత! తత్సమక్షం\nతత్ క్షామయే త్వామహమప్రమేయమ్ ॥",
"పితా సి లోకస్య చరాచరస్య\nత్వమస్య పూజ్యశ్చ గురుర్గరీయాన్\nన త్వత్సమోస్త్యభ్యధికః కుతోన్యః\nలోకత్రయే ప్యప్రతిమప్రభావ! ॥",
"తస్మాత్ప్రణమ్య ప్రణిధాయ కాయం\nప్రసాదయే త్వామహమీశమీడ్యమ్ |\nపితేవ పుత్రస్య సఖేవ సఖ్యుః\nప్రియః ప్రియాయార్హసి దేవ! సోఢుమ్ ॥",
"అదృష్టపూర్వం హృషితో స్మి దృష్ట్వా\nభయేన చ ప్రవ్యథితం మనో మే ।\nతదేవ మే దర్శయ దేవ! రూపం\nప్రసీద దేవేశ! జగన్నివాస! ॥",
"కిరీటినం గదినం చక్రహస్తం\nఇచ్ఛామి త్వాం ద్రష్టుమహం తథైవ |\nతేనైవ రూపేణ చతుర్భుజేన\nసహస్రబాహో! భవ విశ్వమూర్తే! ॥",
"శ్రీ భగవానువాచ:\nమయా ప్రసన్నేన తవార్జునేదం\nరూపం పరం దర్శితమాత్మయోగాత్ |\nతేజోమయం విశ్వమనంతమాద్యం\nయన్మే త్వదన్యేన న దృష్టపూర్వమ్ ॥",
"న వేదయజ్ఞాధ్యయనై ర్న దానైః\nన చ క్రియాభిర్న తపోభిరుగ్రైః ।\nఏవంరూప శ్శక్య అహం నృలోకే\nద్రష్టుం త్వదన్యేన కురుప్రవీర! ॥",
"మా తే వ్యథా మా చ విమూఢభావః\nదృష్ట్వా రూపం ఘోరమీదృఙ్మమేదమ్ |\nవ్యపేతభీః ప్రీతమనాః పునస్త్వం\nతదేవ మే రూపమిదం ప్రపశ్య ॥",
"సంజయ ఉవాచ:\nఇత్యర్జునం వాసుదేవస్తథోక్త్వా\nస్వకం రూపం దర్శయామాస భూయః ।\nఆశ్వాసయామాస చ భీతమేనం\nభూత్వా పున స్సౌమ్యవపుర్మహాత్మా ॥",
"అర్జున ఉవాచ:\nదృష్ట్వేదం మానుషం రూపం తవ సౌమ్యం జనార్దన! |\nఇదానీమస్మిసంవృత్తః సచేతాః ప్రకృతిం గతః ॥",
"శ్రీ భగవానువాచ:\nసుదుర్దర్శమిదం రూపం దృష్టవానసి యన్మమ ।\nదేవా అప్యస్య రూపస్య నిత్యం దర్శనకాంక్షిణః ॥",
"నాహం వేదైర్న తపసా న దానేన న చేజ్యయా |\nశక్య ఏవం విధో ద్రష్టుం దృష్టవానసి మాం యథా ॥",
"భక్త్యా త్వనన్యయా శక్యః అహమేవం విధో ర్జున!|\nజ్ఞాతుం ద్రష్టుం చ తత్త్వేన ప్రవేష్టుం చ పరంతప! ॥",
"మత్కర్మకృన్మత్పరమః మద్భక్త స్సంగవర్జితః |\nనిర్వైరస్సర్వభూతేషు యస్స మామేతి పాండవ! ॥\n\nఓం తత్సదితి, శ్రీమద్భగవద్గీతాసు, ఉపనిషత్సు,\nబ్రహ్మవిద్యాయాం, యోగశాస్త్రే, శ్రీకృష్ణార్జున సంవాదే,\nవిశ్వరూపసందర్శనయోగోనామ ఏకాదశోధ్యాయః"]},
12:{name:"భక్తి యోగం",slokas:[
"అర్జున ఉవాచ:\nఏవం సతతయుక్తా యే భక్తాస్త్వాం పర్యుపాసతే |\nయే చాప్యక్షరమవ్యక్తం తేషాం కే యోగవిత్తమాః ॥",
"శ్రీ భగవానువాచ:\nమయ్యావేశ్య మనో యే మాం నిత్యయుక్తా ఉపాసతే |\nశ్రద్ధయా పరయోపేతాః తే మే యుక్తతమా మతాః ॥",
"యే త్వక్షరమనిర్దేశ్యం అవ్యక్తం పర్యుపాసతే |\nసర్వత్రగమచింత్యం చ కూటస్థమచలం ధ్రువమ్ ॥",
"సంనియమ్యేంద్రియగ్రామం సర్వత్ర సమబుద్ధయః ।\nతే ప్రాప్నువంతి మామేవ సర్వభూతహితే రతాః ॥",
"క్లేశో ధికతరస్తేషాం అవ్యక్తాసక్త చేతసామ్ ।\nఅవ్యక్తా హి గతిర్దుఃఖం దేహవద్భిరవాప్యతే ॥",
"యే తు సర్వాణి కర్మాణి మయి సన్న్యస్య మత్పరాః ।\nఅనన్యేనైవ యోగేన మాం ధ్యాయంత ఉపాసతే ॥",
"తేషామహం సముద్ధర్తా మృత్యుసంసార సాగరాత్ |\nభవామి నచిరాత్ పార్థ! మయ్యావేశిత చేతసామ్ ॥",
"మయ్యేవ మన ఆధత్స్వ మయి బుద్ధిం నివేశయ ।\nనివసిష్యసి మయ్యేవ అత ఊర్ధ్వం న సంశయః ॥",
"అథ చిత్తం సమాధాతుం న శక్నోషి మయి స్థిరమ్ |\nఅభ్యాసయోగేన తతః మామిచ్ఛాప్తుం ధనంజయ! ॥",
"అభ్యాసే ప్యసమర్థో సి మత్కర్మపరమో భవ |\nమదర్థమపి కర్మాణి కుర్వన్ సిద్ధిమవాప్స్యసి ॥",
"అథైతదప్యశక్తోసి కర్తుం మద్యోగమాశ్రితః |\nసర్వకర్మఫలత్యాగం తతః కురు యతాత్మవాన్ ॥",
"శ్రేయో హి జ్ఞానమభ్యాసాత్ జ్ఞానాధ్యానం విశిష్యతే |\nధ్యానాత్కర్మఫలత్యాగః త్యాగాచ్ఛాంతిరనంతరమ్ ॥",
"అద్వేష్టా సర్వభూతానాం మైత్రః కరుణ ఏవ చ |\nనిర్మమో నిరహంకారః సమదుఃఖసుఖః క్షమీ ॥",
"సంతుష్ట స్సతతం యోగీ యతాత్మా దృఢనిశ్చయః |\nమయ్యర్పితమనోబుద్ధిః యో మద్భక్త స్స మే ప్రియః ॥",
"యస్మాన్నో ద్విజతే లోకః లోకాన్నోద్విజతే చ యః |\nహర్షామర్షభయోద్వేగైః ముక్తో యస్స చ మే ప్రియః ॥",
"అనపేక్ష శ్శుచిర్దక్షః ఉదాసీనో గతవ్యథః ।\nసర్వారంభ పరిత్యాగీ యో మద్భక్త స్స మే ప్రియః ॥",
"యో న హృష్యతి న ద్వేష్టి న శోచతి న కాంక్షతి |\nశుభాశుభపరిత్యాగీ భక్తిమాన్ యస్స మే ప్రియః ॥",
"సమశ్శత్రా చ మిత్రే చ తథా మానాపమానయోః |\nశీతోష్ణ సుఖదుఃఖేషు సమస్సంగ వివర్జితః ॥",
"తుల్యనిందాస్తుతిర్మౌనీ సంతుష్టో యేన కేనచిత్ |\nఅనికేత స్పిరమతిః భక్తిమాన్ మే ప్రియో నరః ॥",
"యే తు ధర్మ్యామృతమిదం యథోక్తం పర్యుపాసతే |\nశ్రద్దధానా మత్పరమాః భక్తాస్తే తీవ మే ప్రియాః ॥\n\nఓం తత్సదితి, శ్రీమద్భగవద్గీతాసు, ఉపనిషత్సు,\nబ్రహ్మవిద్యాయాం, యోగశాస్త్రే, శ్రీకృష్ణార్జున సంవాదే,\nభక్తియోగోనామ ద్వాదశోధ్యాయః"]},
13:{name:"క్షేత్ర క్షేత్రజ్ఞ విభాగ యోగం",slokas:[
"శ్రీ భగవానువాచ:\nఇదం శరీరం కౌంతేయ! క్షేత్రమిత్యభిధీయతే |\nఏతద్యో వేత్తి తం ప్రాహుః క్షేత్రజ్ఞ ఇతి తద్విదః ॥",
"క్షేత్రజ్ఞం చాపి మాం విద్ధి సర్వక్షేత్రేషు భారత!|\nక్షేత్రక్షేత్రజ్ఞయోర్ జ్ఞానం యత్తజ్ జ్ఞానం మతం మమ ॥",
"తత్ క్షేత్రం యచ్చ యాదృక్ప యద్వికారి యతశ్చ యత్ |\nస చ యో యత్ప్రభావశ్చ తత్సమాసేన మే శృణు ॥",
"ఋషిభిర్బహుధా గీతం ఛందోభిర్వివిధైః పృథక్ |\nబ్రహ్మసూత్రపదైశ్చైవ హేతుమద్భిర్వినిశ్చితైః ॥",
"మహాభూతాన్యహంకారః బుద్ధిరవ్యక్తమేవ చ |\nఇంద్రియాణి దశైకం చ పంచ చేంద్రియ గోచరాః ॥",
"ఇచ్ఛా ద్వేష స్సుఖం దుఃఖం సంఘాతశ్చేతనా ధృతిః |\nఏతత్ క్షేత్రం సమాసేన సవికారముదాహృతమ్ ॥",
"అమానిత్వమదంభిత్వం అహింసా క్షాంతిరార్జవమ్ |\nఆచార్యోపాసనం శౌచం స్థైర్యమాత్మవినిగ్రహః ॥",
"ఇంద్రియార్థేషు వైరాగ్యం అనహంకార ఏవ చ |\nజన్మమృత్యుజరావ్యాధి దుఃఖదోషానుదర్శనమ్ ॥",
"అసక్తిరనభిష్వంగః పుత్రదారగృహాదిషు |\nనిత్యం చ సమచిత్తత్వం ఇష్టానిష్టోపపత్తిషు ॥",
"మయి చానన్యయోగేన భక్తిరవ్యభిచారిణీ |\nవివిక్తదేశ సేవిత్వం అరతిర్జనసంసది ॥",
"అధ్యాత్మజ్ఞాననిత్యత్వం తత్త్వజ్ఞానార్థదర్శనమ్ |\nఏతఙ్ఞాజ్ఞానమితి ప్రోక్తం అజ్ఞానం యదతో న్యథా ॥",
"జ్ఞేయం యత్తత్ ప్రవక్ష్యామి యజ్ జ్ఞాత్వా, మృతమశ్నుతే|\nఅనాదిమత్పరం బ్రహ్మ న సత్తన్నాసదుచ్యతే ॥",
"సర్వతః పాణిపాదం తత్ సర్వతో క్షిశిరోముఖమ్ |\nసర్వత శ్రుతిమల్లోకే సర్వమావృత్య తిష్ఠతి ॥",
"సర్వేంద్రియగుణాభాసం సర్వేంద్రియవివర్జితమ్ |\nఅసక్తం సర్వభృచ్ఛైవ నిర్గుణం గుణభోక్తృ చ ॥",
"బహిరంతశ్చ భూతానాం అచరం చరమేవ చ |\nసూక్ష్మత్వాత్ తదవిజ్ఞేయం దూరస్థం చాంతికే చ తత్ ॥",
"అవిభక్తం చ భూతేషు విభక్తమివ చ స్థితమ్ |\nభూతభర్తృ చ తజ్జ్ఞేయం గ్రసిష్టు ప్రభవిష్ణు చ ॥",
"జ్యోతిషామపి తజ్జ్యోతిః తమసః పరముచ్య తే |\nజ్ఞానం జ్ఞేయం జ్ఞానగమ్యం హృది సర్వస్య విష్ఠితమ్ ॥",
"ఇతి క్షేత్రం తథా జ్ఞానం జ్ఞేయం చోక్తం సమాసతః |\nమద్భక్త ఏతద్విజ్ఞాయ మద్భావాయోపపద్యతే ॥",
"ప్రకృతిం పురుషం చైవ విద్యనాదీ ఉభావపి ।\nవికారాంశ్చ గుణాంశ్చెవ విద్ధి ప్రకృతిసంభవాన్ ॥",
"కార్యకరణకర్తృత్వే హేతుః ప్రకృతిరుచ్యతే |\nపురుష స్సుఖదుఃఖానాం భోక్తృత్వే హేతురుచ్యతే ॥",
"పురుషః ప్రకృతిస్థో హి భుంక్తే ప్రకృతిజాన్ గుణాన్ |\nకారణం గుణసంగో స్య సదసద్యోని జన్మసు ॥",
"ఉపద్రష్టా నుమంతా చ భర్తా భోక్తా మహేశ్వరః |\nపరమాత్మేతి చాప్యుక్తః దేహే స్మిన్ పురుషః పరః ॥",
"య ఏవం వేత్తి పురుషం ప్రకృతిం చ గుణైస్సహ |\nసర్వథా వర్తమానోపి న స భూయో భిజాయతే ॥",
"ధ్యానేనాత్మని పశ్యంతి కేచిదాత్మానమాత్మనా ।\nఅన్యే సాంఖ్యేన యోగేన కర్మయోగేన చాపరే ॥",
"అన్యే త్వేవమజానంతః శ్రుత్వా న్యేభ్య ఉపాసతే |\nతే పి చాతితరంత్యేవ మృత్యుం శ్రుతిపరాయణాః ॥",
"యావత్సంజాయతే కించిత్ సత్త్వం స్థావరజంగమమ్ |\nక్షేత్రక్షేత్రజ్ఞ సంయోగాత్ తద్విద్ధి భరతర్షభ!॥",
"సమం సర్వేషు భూతేషు తిష్ఠంతం పరమేశ్వరమ్ ।\nవినశ్యత్స్వవినశ్యంతం యః పశ్యతి స పశ్యతి ॥",
"సమం పశ్యన్ హి సర్వత్ర సమవస్థితమీశ్వరమ్ |\nన హినస్త్యాత్మనా2 త్మానం తతో యాతి పరాంగతిమ్ ॥",
"ప్రకృత్యైవ చ కర్మాణి క్రియమాణాని సర్వశః |\nయః పశ్యతి తథా22 త్మానం అకర్తారం స పశ్యతి ॥",
"యదా భూతపృథగ్భావం ఏకస్థమనుపశ్యతి |\nతత ఏవ చ విస్తారం బ్రహ్మ సంపద్యతే తదా ॥",
"అనాదిత్వాన్నిర్గుణత్వాత్ పరమాత్మా యమవ్యయః ।\nశరీరస్థో పి కౌంతేయ! న కరోతి న లిప్యతే ॥",
"యథా సర్వగతం సౌక్ష్మ్యాత్ ఆకాశం నోపలిప్యతే |\nసర్వత్రావస్థితో దేహే తథా22 త్మా నోపలిప్యతే ॥",
"యథా ప్రకాశయత్యేకః కృత్స్నం లోకమిమం రవిః |\nక్షేత్రం క్షేత్రీ తథా కృత్స్నం ప్రకాశయతి భారత! ॥",
"క్షేత్రక్షేత్రజ్ఞయోరేవం అంతరం జ్ఞానచక్షుషా ।\nభూతప్రకృతిమోక్షం చ యే విదుర్యాంతి తే పరమ్ ॥\n\nఓం తత్సదితి, శ్రీమద్భగవద్గీతాసు, ఉపనిషత్సు,\nబ్రహ్మవిద్యాయాం, యోగశాస్త్రే, శ్రీకృష్ణార్జున సంవాదే,\nక్షేత్రక్షేత్రజ్ఞవిభాగయోగోనామ త్రయోదశోధ్యాయః"
]},
14:{name:"గుణత్రయ విభాగ యోగం",slokas:[
"శ్రీభగవానువాచ:\nపరం భూయః ప్రవక్ష్యామి జ్ఞానానాం జ్ఞానముత్తమమ్ |\nయజ్ జ్ఞాత్వా మునయస్సర్వే పరాం సిద్ధిమితో గతాః ॥",
"ఇదం జ్ఞానముపాశ్రిత్య మమ సాధర్మ్యమాగతాః |\nసర్గే పి నోపజాయంతే ప్రలయే న వ్యథంతి చ ॥",
"మమ యోనిర్మహద్బహ్మ తస్మిన్ గర్భం దధామ్యహమ్ |\nసంభవ స్సర్వభూతానాం తతో భవతి భారత!॥",
"సర్వయోనిషు కౌంతేయ! మూర్తయ స్సంభవంతి యాః |\nతాసాం బ్రహ్మ మహద్యోనిః అహం బీజప్రదః పితా ॥",
"సత్త్వం రజస్తమ ఇతి గుణాః ప్రకృతి సంభవాః |\nనిబధ్నంతి మహాబాహో! దేహే దేహినమవ్యయమ్ ॥",
"తత్ర సత్త్వం నిర్మలత్వాత్ ప్రకాశకమనామయమ్ |\nసుఖసంగేన బధ్నాతి జ్ఞానసంగేన చానఘ! ॥",
"రజో రాగాత్మకం విద్ధి తృష్ణాసంగసముద్భవమ్ |\nతన్నిబధ్నాతి కౌంతేయ! కర్మసంగేన దేహినమ్ ॥",
"తమస్త్వజ్ఞానజం విద్ధి మోహనం సర్వదేహినామ్ ।\nప్రమాదాలస్యనిద్రాభిః తన్నిబధ్నాతి భారత! ॥",
"సత్త్వం సుఖే సంజయతి రజః కర్మణి భారత! |\nజ్ఞానమావృత్య తు తమః ప్రమాదే సంజయత్యుత ॥",
"రజస్తమశ్చాభిభూయ సత్త్వం భవతి భారత! |\nరజస్సత్త్వం తమశ్చైవ తమస్సత్త్వం రజస్తథా ॥",
"సర్వద్వారేషు దేహే స్మిన్ ప్రకాశ ఉపజాయతే |\nజ్ఞానం యదా తదా విద్యాత్ వివృద్ధం సత్త్వమిత్యుత ॥",
"లోభః ప్రవృత్తి రారంభః కర్మణామశమస్స్పృహా |\nరజస్యేతాని జాయంతే వివృద్ధే భరతర్షభ! ॥",
"అప్రకాశో ప్రవృత్తిశ్చ ప్రమాదో మోహ ఏవ చ |\nతమస్యేతాని జాయంతే వివృద్ధే కురునందన! ॥",
"యదా సత్త్వే ప్రవృద్ధే తు ప్రలయం యాతి దేహభృత్ |\nతదోత్తమవిదాం లోకాన్ అమలాన్ ప్రతిపద్యతే ॥",
"రజసి ప్రలయం గత్వా కర్మసంగిషు జాయతే |\nతథా ప్రలీనస్తమసి మూఢయోనిషు జాయతే ॥",
"కర్మణ స్సుకృతస్యాహుః సాత్త్వికం నిర్మలం ఫలమ్ |\nరజసస్తు ఫలం దుఃఖం అజ్ఞానం తమసః ఫలమ్ ॥",
"సత్త్వాత్సంజాయతే జ్ఞానం రజసో లోభ ఏవ చ |\nప్రమాదమోహౌ తమసః భవతో జ్ఞానమేవ చ ॥",
"ఊర్ధ్వం గచ్ఛంతి సత్త్వస్థాః మధ్యే తిష్ఠంతి రాజసాః |\nజఘన్య గుణవృత్తిస్థాః అధో గచ్ఛంతి తామసాః ॥",
"నాన్యం గుణేభ్యః కర్తారం యదా ద్రష్టానుపశ్యతి |\nగుణేభ్యశ్చ పరం వేత్తి మద్భావం సో ధిగచ్ఛతి ॥",
"గుణానేతానతీత్య త్రీన్ దేహీ దేహసముద్భవాన్ |\nజన్మమృత్యుజరాదుఃఖైః విముక్తో మృతమశ్నుతే ॥",
"అర్జున ఉవాచ:\nకైర్లింగైస్క్రీన్ గుణానేతాన్ అతీతో భవతి ప్రభో!|\nకిమాచారః కథం చైతాన్ త్రీన్ గుణానతివర్తతే ॥",
"శ్రీభగవానువాచ:\nప్రకాశం చ ప్రవృత్తిం చ మోహమేవ చ పాండవ!|\nన ద్వేష్టి సంప్రవృత్తాని న నివృత్తాని కాంక్షతి ॥",
"ఉదాసీనవదాసీనః గుణైర్యో న విచాల్యతే ।\nగుణా వర్తంత ఇత్యేవ యోవతిష్ఠతి నేంగతే ॥",
"సమదుఃఖసుఖస్స్వస్థః సమలోష్టాశ్మకాంచనః |\nతుల్యప్రియాప్రియో ధీరః తుల్యనిందాత్మసంస్తుతిః ॥",
"మానాపమానయోస్తుల్యః తుల్యో మిత్రారిపక్షయోః |\nసర్వారంభ పరిత్యాగీ గుణాతీత స్స ఉచ్యతే ॥",
"మాం చ యో వ్యభిచారేణ భక్తియోగేన సేవతే |\nస గుణాన్ సమతీత్యైతాన్ బ్రహ్మభూయాయ కల్పతే ॥",
"బ్రహ్మణో హి ప్రతిష్ఠాహం అమృతస్యావ్యయస్య చ |\nశాశ్వతస్య చ ధర్మస్య సుఖస్యైకాంతికస్య చ ॥\n\nఓం తత్సదితి, శ్రీమద్భగవద్గీతాసు, ఉపనిషత్సు,\nబ్రహ్మవిద్యాయాం, యోగశాస్త్రే, శ్రీకృష్ణార్జున సంవాదే,\nగుణత్రయవిభాగయోగోనామ చతుర్దశోధ్యాయః"]},
15:{name:"పురుషోత్తమ యోగం",slokas:[
"శ్రీభగవానువాచ:\nఊర్ధ్వమూలమధశ్శాఖం అశ్వత్థం ప్రాహురవ్యయమ్ ।\nఛందాంసి యస్య పర్ణాని యస్తం వేద స వేదవిత్॥",
"అధశ్చోర్ధ్వం ప్రసృతాస్తస్య శాఖాః\nగుణప్రవృద్ధా విషయప్రవాలాః ।\nఅధశ్చమూలాన్యనుసంతతాని\nకర్మానుబంధీని మనుష్యలోకే॥",
"న రూపమస్యేహ తథోపలభ్యతే\nనాంతో న చాదిర్న చ సంప్రతిష్ఠా |\nఅశ్వత్థమేనం సువిరూఢమూలం\nఅసంగశస్త్రేణ దృఢేన ఛిత్వా॥",
"తతః పదం తత్పరిమార్గితవ్యం\nయస్మిన్ గతా న నివర్తంతి భూయః |\nతమేవ చాద్యం పురుషం ప్రపద్యే\nయతః ప్రవృత్తిః ప్రసృతా పురాణీ॥",
"నిర్మానమోహా జిత సంగదోషాః\nఅధ్యాత్మనిత్యా వినివృత్తకామాః ।\nద్వంద్వైర్విముక్తా స్సుఖదుఃఖసంత్తైః\nగచ్ఛంత్యమూఢాః పదమవ్యయం తత్॥",
"న తద్భాసయతే సూర్యః న శశాంకో న పావకః |\nయద్ధత్వా న నివర్తంతే తద్ధామ పరమం మమ ॥",
"మమైవాంశో జీవలోకే జీవభూత స్సనాతనః |\nమనష్షష్టానీంద్రియాణి ప్రకృతిస్థాని కర్షతి ॥",
"శరీరం యదవాప్నోతి యచ్ఛాప్యుత్ప్రమతీశ్వరః |\nగృహీత్వైతాని సంయాతి వాయుర్గంధానివాశయాత్॥",
"శ్రోత్రం చక్షు స్స్పర్శనం చ రసనం ఘ్రాణమేవ చ |\nఅధిష్ఠాయ మనశ్చాయం విషయానుపసేవతే ॥",
"ఉతామంతం స్థితం వాపి భుంజానం వా గుణాన్వితమ్।\nవిమూఢా నానుపశ్యన్తి పశ్యంతి జ్ఞానచక్షుషః ॥",
"యతంతో యోగినశ్చైనం పశ్యంత్యాత్మన్యవస్థితమ్ ।\nయతంతో ప్యకృతాత్మానః నైనం పశ్యంత్యచేతసః ॥",
"యదాదిత్యగతం తేజః జగద్భాసయతేఖిలమ్ |\nయచ్చన్ద్రమసి యచ్చాగ్నౌ తత్తేజో విద్ధి మామకమ్ ॥",
"గామావిశ్య చ భూతాని ధారయామ్యహమోజసా |\nపుష్ణామి చౌషధీ స్సర్వాః సోమో భూత్వా రసాత్మకః ॥",
"అహం వైశ్వానరో భూత్వా ప్రాణినాం దేహమాశ్రితః ।\nప్రాణాపాన సమాయుక్తః పచామ్యన్నం చతుర్విధమ్ ॥",
"సర్వస్య చాహం హృది సన్నివిష్టః\nమత్త స్మృతిర్ జ్ఞానమపోహనం చ |\nవేదైశ్చ సర్వైరహమేవ వేద్యః\nవేదాంతకృద్వేదవిదేవ చాహమ్ ॥",
"ద్వావిమౌ పురుషౌ లోకే క్షరశ్చాక్షర ఏవ చ |\nక్షర స్సర్వాణి భూతాని కూటస్థోక్షర ఉచ్యతే ॥",
"శ్రీమద్భగవద్గీత\nఉత్తమః పురుషస్త్వన్యః పరమాత్మేత్యుదాహృతః |\nయో లోకత్రయమావిశ్య బిభర్త్యవ్యయ ఈశ్వరః॥",
"యస్మాత్ క్షరమతీతోహం అక్షరాదపి చోత్తమః ।\nఅతో స్మి లోకే వేదే చ ప్రథితః పురుషోత్తమః ॥",
"యో మామేవమసమ్మూఢః జానాతి పురుషోత్తమమ్ |\nస సర్వవిద్భజతి మాం సర్వభావేన భారత! ॥",
"ఇతి గుహ్యతమం శాస్త్రం ఇదముక్తం మయా నఘ!|\nఏతద్బుద్ధ్వా బుద్ధిమాన్ స్యాత్ కృతకృత్యశ్చ భారత!॥\n\nఓం తత్సదితి, శ్రీమద్భగవద్గీతాసు, ఉపనిషత్సు,\nబ్రహ్మవిద్యాయాం, యోగశాస్త్రే, శ్రీకృష్ణార్జునసంవాదే,\nపురుషోత్తమప్రాప్తియోగోనామ పంచదశోధ్యాయః"
]},
16:{name:"దైవాసుర సంపద విభాగ యోగం",slokas:[
"శ్రీ భగవానువాచ:\nఅభయం సత్త్వసంశుద్ధిః జ్ఞానయోగ వ్యవస్థితిః ।\nదానం దమశ్చ యజ్ఞశ్చ స్వాధ్యాయస్తప ఆర్జవమ్॥",
"అహింసా సత్యమక్రోధః త్యాగ శ్శాంతిరపైశునమ్ |\nదయా భూతేష్వలోలుప్త్వం మార్ధవం హ్రీరచాపలమ్ ॥",
"తేజః క్షమా ధృతిశ్శాచం అద్రోహో నాతిమానితా |\nభవంతి సంపదం దైవీం అభిజాతస్య భారత! ॥",
"దంభో దర్పో భిమానశ్చ క్రోధః పారుష్యమేవ చ |\nఅజ్ఞానం చాభిజాతస్య పార్థ! సంపదమాసురీమ్ ॥",
"దైవీ సంపద్విమోక్షాయ నిబంధాయాసురీ మతా |\nమా శుచస్సంపదం దైవీం అభిజాతో సి పాండవ!॥",
"ద్వౌ భూతసర్గా లోకే స్మిన్ దైవ ఆసుర ఏవ చ |\nదైవో విస్తరశః ప్రోక్తః ఆసురం పార్థ! మే శృణు ॥",
"ప్రవృత్తిం చ నివృత్తిం చ జనా న విదురాసురాః |న శౌచం నాపి చాచారః న సత్యం తేషు విద్యతే ॥",
"అసత్యమప్రతిష్ఠం తే జగదాహు రనీశ్వరమ్ |\nఅపరస్పరసంభూతం కిమన్యత్ కామహైతుకమ్ ॥",
"ఏతాం దృష్టిమవష్టభ్య నష్టాత్మానో ల్పబుద్ధయః |\nప్రభవంత్యుగ్రకర్మాణః క్షయాయ జగతో హితాః ॥",
"కామమాశ్రిత్య దుష్పూరం దంభమానమదాన్వితాః |\nమోహాద్గృహీత్వా సద్రాహాన్ ప్రవర్తంతే శుచివ్రతాః ॥",
"చింతామపరిమేయాం చ ప్రళయాంతాముపాశ్రితాః |\nకామోపభోగపరమాః ఏతావదితి నిశ్చితాః ॥",
"ఆశాపాశశతైర్బద్ధాః కామక్రోధపరాయణాః |\nఈహంతే కామభోగార్థం అన్యాయేనార్థసంచయాన్ ॥",
"ఇదమద్య మయా లబ్ధం ఇమం ప్రాప్స్యే మనోరథమ్|\nఇదమస్తీదమపి మే భవిష్యతి పునర్ధనమ్ ॥",
"అసౌ మయా హత శ్శత్రుః హనిష్యే చాపరానపి ।\nఈశ్వరో హమహం భోగీ సిద్దో హం బలవాన్ సుఖీ ॥",
"ఆధ్యో భిజనవానస్మి కో న్యోస్తి సదృశో మయా |\nయక్ష్యే దాస్యామి మోదిష్యే ఇత్యజ్ఞానవిమోహితాః॥",
"అనేకచిత్తవిభ్రాంతాః మోహజాలసమావృతాః |\nప్రసక్తాః కామభోగేషు పతంతి నరకే శుచౌ ॥",
"ఆత్మసంభావితా స్లబ్ధాః ధనమానమదాన్వితాః ।\nయజంతే నామయజ్ఞస్తే దంభేనావిధిపూర్వకమ్ ॥",
"అహంకారం బలం దర్పం కామం క్రోధం చ సంశ్రితాః |\nమామాత్మపరదేహేషు ప్రద్విషంతో భ్యసూయకాః ॥",
"తానహం ద్విషతః క్రూరాన్ సంసారేషు నరాధమాన్ |\nక్షిపామ్యజస్ర మశుభాన్ ఆసురీష్వేవ యోనిషు ॥",
"ఆసురీం యోనిమాపన్నాః మూఢా జన్మని జన్మని ।\nమామప్రాప్యైవ కౌంతేయ తతో యాంత్యధమాం గతిమ్॥",
"త్రివిధం నరకస్యేదం ద్వారం నాశనమాత్మనః |\nకామః క్రోధస్తథాలోభః తస్మాదేతత్రయం త్యజేత్ ॥",
"ఏతైర్విముక్తః కౌంతేయ తమోద్వారై స్త్రిభిర్నరః ।\nఆచరత్యాత్మనశ్రేయః తతో యాతి పరాం గతిమ్ ॥",
"యశ్శాస్త్రవిధి ముత్సృజ్య వర్తతే కామకారతః |\nన స సిద్ధిమవాప్నోతి న సుఖం న పరాం గతిమ్ ॥",
"తస్మాచ్ఛాస్త్రం ప్రమాణం తే కార్యాకార్యవ్యవస్థితౌ ।\nజ్ఞాత్వా శాస్త్రవిధానోక్తం కర్మ కర్తుమిహార్హసి ॥\n\nఓం తత్సదితి, శ్రీమద్భగవద్గీతాసు, ఉపనిషత్సు,\nబ్రహ్మవిద్యాయాం, యోగశాస్త్రే, శ్రీకృష్ణార్జునసంవాదే\nదైవాసురసంపద్విభాగయోగోనామ షోడశోధ్యాయః"
]},
17:{name:"మోక్ష సన్యాస యోగం",slokas:[
    "అర్జున ఉవాచ:\nయే శాస్త్రవిధిముత్సృజ్య యజంతే శ్రద్ధయాన్వితాః।\nతేషాం నిష్ఠా తు కా కృష్ణ! సత్త్వమాహో రజస్తమః॥",
"శ్రీభగవానువాచ:\nత్రివిధా భవతి శ్రద్ధా దేహినాం సా స్వభావజా|\nసాత్త్వికీ రాజసీ చైవ తామసీ చేతి తాం శృణు॥",
"సత్త్వానురూపా సర్వస్య శ్రద్ధా భవతి భారత!|\nశ్రద్ధామయో యం పురుషః యో యచ్ఛద్ధ స్స ఏవ సః॥",
"యజంతే సాత్త్వికా దేవాన్ యక్షరక్షాంసి రాజసాః ।\nప్రేతాన్ భూతగణాంశ్చాన్యే యజంతే తామసా జనాః॥",
"అశాస్త్రవిహితం ఘోరం తప్యంతే యే తపో జనాః ।\nదంభాహంకార సంయుక్తాః కామరాగబలాన్వితాః॥",
"కర్శయంత శ్శరీరస్థం భూతగ్రామమచేతసః ।\nమాం చైవాంత శ్శరీరస్థం తాన్విద్ధ్యాసురనిశ్చయాన్॥",
"ఆహారస్త్వపి సర్వస్య త్రివిధో భవతి ప్రియః|\nయజ్ఞస్తపస్తథా దానం తేషాం భేదమిమం శృణు॥",
"ఆయుస్సత్త్వబలారోగ్య సుఖప్రీతి వివర్ధనాః।\nరస్యా స్స్నిగ్ధా సిరా హృద్యాః ఆహారాస్సాత్త్వికప్రియాః॥",
"కట్వాలవణాత్యుష్ణ తీక్రూక్షవిదాహినః।\nఆహారా రాజసస్యేష్టాః దుఃఖశోకామయప్రదాః॥",
"యాతయామం గతరసం పూతి పర్యుషితం చ యత్|\nఉచ్ఛిష్టమపి చామేధ్యం భోజనం తామసప్రియమ్॥",
"అఫలాకాంక్షిభిర్యజ్ఞః విధిదృష్టో య ఇజ్యతే|\nయష్టవ్యమేవేతి మనః సమాధాయ స సాత్త్వికః॥",
"అభిసంధాయ తు ఫలం దంభార్థమపి చైవ యత్|\nఇజ్యతే భరతశ్రేష్ఠ! తం యజ్ఞం విద్ధి రాజసమ్॥",
"విధిహీనమసృష్టాన్నం మంత్రహీనమదక్షిణమ్।\nశ్రద్ధావిరహితం యజ్ఞం తామసం పరిచక్షతే॥",
"దేవద్విజగురుప్రాజ్ఞ పూజనం శౌచమార్జవమ్|\nబ్రహ్మచర్య మహింసా చ శారీరం తప ఉచ్యతే॥",
"అనుద్వేగకరం వాక్యం సత్యం ప్రియహితం చ యత్|\nస్వాధ్యాయాభ్యసనం చైవ వాఙ్మయం తప ఉచ్యతే॥",
"మనఃప్రసాద స్సౌమ్యత్వం మౌనమాత్మవినిగ్రహః|\nభావసంశుద్ధిరిత్యేతత్ తపో మానస ముచ్యతే॥",
"శ్రద్ధయా పరయా తప్తం తపస్తత్రివిధం నరైః|\nఅఫలాకాంక్షిభిర్యుక్తాః సాత్త్వికం పరిచక్షతే॥",
"సత్కారమానపూజార్థం తపో దంభేన చైవ యత్|\nక్రియతే తదిహ ప్రోక్తం రాజసం చలమధ్రువమ్॥",
"మూఢగ్రాహేణాత్మనో యత్ పీడయా క్రియతే తపః|\nపరస్యోత్సాదనార్థం వా తత్తామస ముదాహృతమ్॥",
"దాతవ్యమితి యద్దానం దీయతే నుపకారిణే|\nదేశే కాలే చ పాత్రే చ తద్దానం సాత్త్వికం స్మృతమ్॥",
"యత్తు ప్రత్యుపకారార్థం ఫలముద్దిశ్య వా పునః|\nదీయతే చ పరిక్లిష్టం తద్దానం రాజసం స్మృతమ్॥",
"అదేశకాలే యద్దానం అపాత్రేభ్యశ్చ దీయతే|\nఅసత్కృతమవజ్ఞాతం తత్తామస ముదాహృతమ్॥",
"ఓం తత్సదితి నిర్దేశః బ్రహ్మణస్త్రివిధ స్స్మృతః|\nబ్రాహ్మణాస్తేన వేదాశ్చ యజ్ఞాశ్చ విహితాః పురా॥",
"తస్మాదోమిత్యుదాహృత్య యజ్ఞదానతపఃక్రియాః|\nప్రవర్తంతే విధానోక్తాః సతతం బ్రహ్మవాదినామ్ ॥",
"తదిత్యనభిసంధాయ ఫలం యజ్ఞతపఃక్రియాః।\nదానక్రియాశ్చ వివిధాః క్రియంతే మోక్షకాంక్షిభిః॥",
"సద్భావే సాధుభావే చ సదిత్యేతత్ప్రయుజ్యతే|\nప్రశస్తే కర్మణి తథా సచ్ఛబ్దః పార్థ! యుజ్యతే॥",
"యజ్ఞే తపసి దానే చ స్థితి స్సదితి చోచ్యతే|\nకర్మ చైవ తదదీయం సదిత్యేవాభిధీయతే॥",
"అశ్రద్ధయా హుతం దత్తం తపస్తప్తం కృతం చ యత్|\nఅసదిత్యుచ్యతే పార్థ! న చ తత్రేత్య నో ఇహ॥\n\nఓం తత్సదితి, శ్రీమద్భగవద్గీతాసు, ఉపనిషత్సు,\nబ్రహ్మవిద్యాయాం, యోగశాస్త్రే, శ్రీకృష్ణార్జున సంవాదే,\nశ్రద్ధాత్రయవిభాగయోగోనామ సప్తదశోధ్యాయః"]},
18:{name:"మోక్ష సన్యాస యోగం",slokas:[
"అర్జున ఉవాచ:\nసన్న్యాసస్య మహాబాహో! తత్త్వమిచ్ఛామి వేదితుమ్|\nత్యాగస్య చ హృషీకేశ! పృథక్కేశినిషూదన! ॥",
"శ్రీ భగవానువాచ:\nకామ్యానాం కర్మణాం న్యాసం సన్న్యాసం కవయో విదుః|\nసర్వకర్మఫలత్యాగం ప్రాహుస్త్యాగం విచక్షణాః ॥",
"త్యాజ్యం దోషవదిత్యేకే కర్మ ప్రాహుర్మనీషిణః ।\nయజ్ఞదానతపఃకర్మ న త్యాజ్యమితి చాపరే ॥",
"నిశ్చయం శృణు మే తత్ర త్యాగే భరతసత్తమ!|\nత్యాగో హి పురుషవ్యాఘ్ర! త్రివిధ స్సంప్రకీర్తితః॥",
"యజ్ఞదానతపః కర్మ న త్యాజ్యం కార్యమేవ తత్|\nయజ్ఞో దానం తపశ్చైవ పావనాని మనీషిణామ్॥",
"ఏతాన్యపి తు కర్మాణి సంగం త్యక్త్వా ఫలాని చ|\nకర్తవ్యానీతి మే పార్థ! నిశ్చితం మతముత్తమమ్ ॥",
"నియతస్య తు సన్న్యాసః కర్మణో నోపపద్యతే|\nమోహాత్తస్య పరిత్యాగః తామసః పరికీర్తితః ॥",
"దుఃఖమిత్యేవ యత్కర్మ కాయక్లేశభయాత్ త్యజేత్|\nస కృత్వా రాజసం త్యాగం నైవ త్యాగఫలం లభేత్॥",
"కార్యమిత్యేవ యత్కర్మ నియతం క్రియతే ర్జున!|\nసంగం త్యక్త్వా ఫలం చైవ స త్యాగ స్సాత్త్వికో మతః ॥",
"న ద్వేష్ట్యకుశలం కర్మ కుశలే నానుషజ్జతే ।\nత్యాగీ సత్త్వసమావిష్టః మేధావీ ఛిన్నసంశయః ॥",
"న హి దేహభృతా శక్యం త్యక్తుం కర్మాణ్యశేషతః|\nయస్తు కర్మఫలత్యాగీ స త్యాగీత్యభిధీయతే॥",
"అనిష్టమిష్టం మిశ్రం చ త్రివిధం కర్మణః ఫలమ్|\nభవత్యత్యాగినాం ప్రేత్య న తు సన్న్యాసినాం క్వచిత్॥",
"పంచైతాని మహాబాహో! కారణాని నిబోధ మే|\nసాంఖ్యే కృతాంతే ప్రోక్తాని సిద్ధయే సర్వకర్మణామ్ ॥",
"అధిష్ఠానం తథా కర్తా కరణం చ పృథగ్విధమ్|\nవివిధాశ్చ పృథక్ చేష్టాః దైవం చైవాత్ర పంచమమ్ ॥",
"శరీరవాఙ్మనోభిర్యత్ కర్మ ప్రారభతే నరః|\nన్యాయ్యం వా విపరీతం వా పంచైతే తస్య హేతవః ॥",
"తత్రైవం సతి కర్తారం ఆత్మానం కేవలం తు యః|\nపశ్యత్యకృత బుద్ధిత్వాత్ న స పశ్యతి దుర్మతిః ॥",
"యస్య నాహంకృతో భావః బుద్ధిర్యస్య న లిప్యతే|\nహత్వా పి స ఇమాల్లోకాన్ న హంతి న నిబధ్యతే ॥",
"జ్ఞానం జ్ఞేయం పరిజ్ఞాతా త్రివిధా కర్మచోదనా|\nకరణం కర్మ కర్తేతి త్రివిధః కర్మసంగ్రహః ॥",
"జ్ఞానం కర్మ చ కర్తా చ త్రిధైవ గుణభేదతః|\nప్రోచ్యతే గుణసంఖ్యానే యథావచ్ఛృణు తాన్యపి ॥",
"సర్వభూతేషు యేనైకం భావమవ్యయమీక్షతే|\nఅవిభక్తం విభక్తేషు తజ్ఞాజ్ఞానం విద్ధి సాత్త్వికమ్ ॥",
"పృథక్త్వేన తు యజ్ఞాజ్ఞానం నానాభావాన్ పృథగ్విధాన్|\nవేత్తి సర్వేషు భూతేషు తఙ్ఞాజ్ఞానం విద్ధి రాజసమ్ ॥",
"యత్తు కృత్స్నవదేకస్మిన్ కార్యే సక్తమహైతుకమ్|\nఅతత్త్వార్థవదల్పం చ తత్తామసముదాహృతమ్ ॥",
"నియతం సంగరహితం అరాగద్వేషతః కృతమ్|\nఅఫలప్రేప్సునా కర్మ యత్తత్ సాత్త్వికముచ్యతే ॥",
"యత్తు కామేప్సునా కర్మ సాహంకారేణ వా పునః|\nక్రియతే బహులాయాసం తద్రాజస ముదాహృతమ్ ॥",
"అనుబంధం క్షయం హింసాం అనపేక్ష్య చ పౌరుషమ్|\nమోహాదారభ్యతే కర్మ యత్తత్తామస ముచ్యతే ॥",
"ముక్తసంగో నహంవాదీ ధృత్యుత్సాహ సమన్వితః|\nసిద్ధసిద్ధ్యి ర్నిర్వికారః కర్తా సాత్త్విక ఉచ్యతే ॥",
"రాగీ కర్మఫలప్రేప్సుః లుబో హింసాత్మకో శుచిః|\nహర్షశోకాన్వితః కర్తా రాజసః పరికీర్తితః ॥",
"అయుక్తః ప్రాకృతస్తబ్ధః శఠో నైష్కృతికోలసః।\nవిషాదీ దీర్ఘసూత్రీ చ కర్తా తామస ఉచ్యతే ॥",
"బుద్ధేర్భేదం ధృతేశ్చైవ గుణతస్త్రివిధం శృణు|\nప్రోచ్యమానమశేషేణ పృథక్త్వేన ధనంజయ! ॥",
"ప్రవృత్తిం చ నివృత్తిం చ కార్యాకార్యే భయాభయే|\nబంధం మోక్షం చ యా వేత్తి బుద్ధి స్సా పార్థ! సాత్త్వికీ॥",
"యయా ధర్మమధర్మం చ కార్యం చాకార్యమేవ చ|\nఅయథావత్ప్రజానాతి బుద్ధి స్సా పార్థ! రాజసీ॥",
"అధర్మం ధర్మమితి యా మన్యతే తమసా వృతా|\nసర్వార్థాన్ విపరీతాంశ్చ బుద్ధి స్సా పార్థ! తామసీ॥",
"ధృత్యా యయా ధారయతే మనఃప్రాణేంద్రియక్రియాః।\nయోగేనావ్యభిచారిణ్యా ధృతి స్సా పార్థ! సాత్త్వికీ॥",
"యయా తు ధర్మకామార్థాన్ ధృత్యా ధారయతే ర్జున!|\nప్రసంగేన ఫలాకాంక్షీ ధృతి స్సా పార్థ! రాజసీ ॥",
"యయా స్వప్నం భయం శోకం విషాదం మద మేవ చ|\nన విముంచతి దుర్మేధాః ధృతిస్సా తామసీ మతా! ॥",
"సుఖం త్విదానీం త్రివిధం శృణు మే భరతర్షభ!|\nఅభ్యాసాద్రమతే యత్ర దుఃఖాంతం చ నిగచ్ఛతి ॥",
"యత్తదగ్రే విషమివ పరిణామే మృతోపమమ్ ।\nతత్సుఖం సాత్త్వికం ప్రోక్తం ఆత్మబుద్ధిప్రసాదజమ్ ॥",
"విషయేంద్రియ సంయోగాత్ యత్తదగ్రే మృతోపమమ్|\nపరిణామే విషమివ తత్సుఖం రాజసం స్మృతమ్ ॥",
"యదగ్రే చానుబంధే చ సుఖం మోహనమాత్మనః|\nనిద్రాలస్యప్రమాదోర్థం తత్తామసముదాహృతమ్ ॥",
"న తదస్తి పృథివ్యాం వా దివి దేవేషు వా పునః|\nసత్త్వం ప్రకృతిజైర్ముక్తం యదేభి స్స్యాత్ త్రిభిర్గుణైః ॥",
"బ్రాహ్మణ క్షత్రియవిశాం శూద్రాణాం చ పరంతప!|\nకర్మాణి ప్రవిభక్తాని స్వభావ ప్రభవైర్గుణైః ॥",

};

function loadFromHash(){
  const hash = location.hash;

  if(!hash.startsWith("#chapter-")){
    home.classList.remove("hidden");
    viewer.classList.add("hidden");
    return;
  }

  const num = parseInt(hash.replace("#chapter-",""));
  if(!gitaData[num]) return;

  bell.currentTime = 0;
  bell.play().catch(()=>{});

  home.classList.add("hidden");
  viewer.classList.remove("hidden");

  chapterTitle.innerText = `Chapter ${num}: ${gitaData[num].name}`;
  slokaContainer.innerHTML = "";

  gitaData[num].slokas.forEach((sloka,i)=>{
    const div = document.createElement("div");
    div.className = "sloka-box";
    div.innerText = `శ్లోకం ${i+1}\n${sloka}`;
    slokaContainer.appendChild(div);
  });
}

window.addEventListener("load", loadFromHash);
window.addEventListener("hashchange", loadFromHash);

function navigate(page){
    window.location.href = page;
  }

function goBack(){
  location.hash = "";
}
